<?xml version="1.0" encoding="UTF-8"?>
<!--
  PROSTOR brand mark — капля воды + sparkle (AI-маркер).
  Источник: claude design (PROSTOR-Smart-Search.html mockup, 8 мая 2026).
  Палитра OKLCH:
    - oklch(72% 0.16 232) → светло-голубой (top-left highlight)
    - oklch(58% 0.22 250) → насыщенный синий (mid)
    - oklch(48% 0.26 270) → глубокий сине-фиолетовый (bottom-right shadow)
  Sparkle = AI-маркер. Использование: PWA, favicon, FAB на карте, header.
  ViewBox 48x48, центральный rendering для PNG-генерации через playwright.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
    <defs>
        <linearGradient id="wd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="oklch(72% 0.16 232)"/>
            <stop offset="55%" stop-color="oklch(58% 0.22 250)"/>
            <stop offset="100%" stop-color="oklch(48% 0.26 270)"/>
        </linearGradient>
        <radialGradient id="wd-shine" cx="35%" cy="30%" r="40%">
            <stop offset="0%" stop-color="white" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </radialGradient>
    </defs>
    <path d="M24 4 C30 12 38 18 38 28 a14 14 0 1 1-28 0 c0-10 8-16 14-24z" fill="url(#wd-grad)"/>
    <ellipse cx="18" cy="20" rx="5" ry="8" fill="url(#wd-shine)" transform="rotate(-25 18 20)"/>
    <g class="wd-spark">
        <path d="M24 24 L25.5 27 L28.5 28 L25.5 29 L24 32 L22.5 29 L19.5 28 L22.5 27 z" fill="white" opacity="0.95"/>
        <circle cx="30" cy="22" r="0.9" fill="white" opacity="0.85"/>
        <circle cx="19" cy="33" r="0.7" fill="white" opacity="0.7"/>
    </g>
</svg>
