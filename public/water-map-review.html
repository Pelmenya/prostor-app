-100: #fff;\\n  --color-base-200: oklch(98% 0 0);\\n  --color-base-300: oklch(95% 0 0);\\n  --color-base-content: oklch(21% 0.006 285.885);\\n  --color-success: oklch(76% 0.177 163.223);\\n  --color-warning: oklch(82% 0.189 84.429);\\n  --color-error:   oklch(71% 0.194 13.428);\\n\\n  /* Severity scale */\\n  --sev-safe:        oklch(72% 0.16 150);\\n  --sev-borderline:  oklch(82% 0.16 95);\\n  --sev-concerning:  oklch(72% 0.18 50);\\n  --sev-unsafe:      oklch(62% 0.22 25);\\n\\n  /* Aquifer (refreshed — no severity-green conflict) */\\n  --aq-verkhovodka:  oklch(50% 0.09 55);   /* terracotta */\\n  --aq-pesch:        oklch(68% 0.12 95);   /* khaki / sand */\\n  --aq-pesch-izv:    oklch(70% 0.10 195);  /* teal */\\n  --aq-izv:          oklch(55% 0.18 250);  /* strong blue */\\n  --aq-artezian:     oklch(48% 0.20 305);  /* deep purple */\\n\\n  /* Type */\\n  --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\\n}\\n\\nhtml, body {\\n  font-family: var(--font-sans);\\n  color: var(--color-base-content);\\n  -webkit-font-smoothing: antialiased;\\n}\\n\\n.gradient-text {\\n  background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n  -webkit-background-clip: text; background-clip: text; color: transparent;\\n}\\n\\n/* ============================================================\\n   Map placeholder — looks like CARTO Voyager + heatmap stack\\n   Drop this on a full-bleed div with class .map-bg\\n   ============================================================ */\\n.map-bg {\\n  position: absolute; inset: 0;\\n  background:\\n    /* heatmap blobs (red / orange / yellow / green) */\\n    radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n    radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n    radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n    radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n    radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n    radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n    radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n    radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%),\\n    /* basemap tone (CARTO Voyager cream) */\\n    linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\n}\\n.map-bg::after {\\n  /* faint road/grid hint */\\n  content: '';\\n  position: absolute; inset: 0;\\n  background-image:\\n    linear-gradient(60deg, rgba(0,0,0,.04) 1px, transparent 1px),\\n    linear-gradient(-60deg, rgba(0,0,0,.04) 1px, transparent 1px);\\n  background-size: 80px 80px, 80px 80px;\\n  pointer-events: none;\\n}\\n.map-bg .dots {\\n  position: absolute; inset: 0;\\n  background-image:\\n    radial-gradient(circle 2px at 18% 22%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 32% 30%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 44% 40%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 56% 48%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 30% 62%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 62% 65%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 72% 50%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 48% 70%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 78% 30%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 26% 48%, var(--sev-unsafe) 100%, transparent 0);\\n}\\n.map-label {\\n  position: absolute;\\n  font: 500 11px var(--font-sans);\\n  color: rgba(60, 60, 70, 0.55);\\n  letter-spacing: 0.04em;\\n  text-transform: uppercase;\\n  pointer-events: none;\\n}\\n\\n/* Severity dot */\\n.sev-dot {\\n  display: inline-block; width: 8px; height: 8px; border-radius: 999px;\\n  flex-shrink: 0;\\n}\\n.sev-dot.safe       { background: var(--sev-safe); }\\n.sev-dot.borderline { background: var(--sev-borderline); }\\n.sev-dot.concerning { background: var(--sev-concerning); }\\n.sev-dot.unsafe     { background: var(--sev-unsafe); }\\n\\n/* Severity chip */\\n.sev-chip {\\n  display: inline-flex; align-items: center; gap: 6px;\\n  padding: 4px 10px; border-radius: 999px;\\n  font: 500 12px var(--font-sans);\\n}\\n.sev-chip.unsafe     { background: color-mix(in oklch, var(--sev-unsafe) 18%, white); color: oklch(35% 0.15 25); }\\n.sev-chip.concerning { background: color-mix(in oklch, var(--sev-concerning) 22%, white); color: oklch(38% 0.13 50); }\\n.sev-chip.borderline { background: color-mix(in oklch, var(--sev-borderline) 30%, white); color: oklch(40% 0.10 80); }\\n.sev-chip.safe       { background: color-mix(in oklch, var(--sev-safe) 28%, white); color: oklch(38% 0.10 165); }\\n\\n/* Phone frame */\\n.phone {\\n  width: 390px; height: 844px;\\n  border-radius: 44px;\\n  background: #000;\\n  padding: 10px;\\n  box-shadow: 0 30px 60px -20px rgba(20,30,60,.25), 0 0 0 1px rgba(0,0,0,.04);\\n  position: relative;\\n}\\n.phone-screen {\\n  width: 100%; height: 100%;\\n  border-radius: 36px; overflow: hidden;\\n  background: #fff; position: relative;\\n}\\n.phone-notch {\\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\\n  width: 110px; height: 28px; background: #000; border-radius: 999px; z-index: 50;\\n}\\n\\n/* App-chrome (header + dock) */\\n.app-header {\\n  height: 56px; padding: 0 16px;\\n  display: flex; align-items: center; justify-content: space-between;\\n  background: #fff; border-bottom: 1px solid rgba(0,0,0,.06);\\n  position: relative; z-index: 30;\\n}\\n.app-header .logo {\\n  font: 800 17px var(--font-sans); letter-spacing: 0.02em;\\n}\\n.app-dock {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 72px; background: #fff;\\n  display: grid; grid-template-columns: 56px 1fr 1fr 1fr;\\n  align-items: center; padding: 0 8px;\\n  box-shadow: 0 -1px 3px 0 rgba(0,0,0,.06);\\n  z-index: 30;\\n}\\n.app-dock .avatar {\\n  width: 36px; height: 36px; border-radius: 999px; background: #1a1a1a; color: #fff;\\n  display: grid; place-items: center; font: 600 13px var(--font-sans);\\n}\\n.dock-tab {\\n  display: flex; flex-direction: column; align-items: center; gap: 2px;\\n  font: 500 11px var(--font-sans); color: oklch(40% 0.005 285);\\n}\\n.dock-tab.active { color: var(--color-primary); }\\n.dock-tab .ico { width: 20px; height: 20px; }\\n.dock-tab.active::after {\\n  content: ''; width: 24px; height: 2px; border-radius: 999px;\\n  background: var(--color-base-content); margin-top: 2px;\\n}\\n&lt;\\u002Fstyle&gt;\\n&lt;style&gt;\\n  body { background: oklch(97% 0.005 250); padding: 32px 16px 80px; }\\n  .stage { max-width: 1280px; margin: 0 auto; }\\n  .row { display: grid; grid-template-columns: repeat(3, 390px); gap: 28px; justify-content: center; }\\n  @media (max-width: 1280px) { .row { grid-template-columns: 1fr; gap: 64px; } }\\n  .caption { color: oklch(40% 0.005 285); font-size: 13px; line-height: 1.6; max-width: 390px; margin: 12px auto 0; }\\n  .caption b { color: var(--color-base-content); }\\n  .stamp { display:inline-block; font: 600 10px var(--font-sans); letter-spacing:0.1em; text-transform:uppercase;\\n           color: var(--color-primary); padding: 3px 8px; border-radius: 999px;\\n           background: color-mix(in oklch, var(--color-primary) 10%, white); margin-bottom: 8px; }\\n  h2 { font: 700 28px var(--font-sans); letter-spacing: -0.01em; margin: 0 0 4px; }\\n  .lede { color: oklch(45% 0.005 285); font-size: 15px; max-width: 720px; margin: 0 auto 36px; text-align: center; }\\n  .pro, .con { font-size: 12px; line-height: 1.5; }\\n  .pro { color: oklch(38% 0.10 165); }\\n  .con { color: oklch(40% 0.13 25); }\\n  .trade-offs { margin-top: 12px; display: grid; gap: 6px; max-width: 390px; margin-left: auto; margin-right: auto; }\\n  .trade-offs &gt; div { display: flex; gap: 8px; align-items: flex-start; }\\n  .trade-offs .badge {\\n    flex: 0 0 auto; font: 600 9px var(--font-sans); letter-spacing: .05em; text-transform: uppercase;\\n    padding: 2px 6px; border-radius: 4px; margin-top: 1px;\\n  }\\n  .trade-offs .badge.pro { background: color-mix(in oklch, var(--sev-safe) 25%, white); color: oklch(35% 0.12 165); }\\n  .trade-offs .badge.con { background: color-mix(in oklch, var(--sev-concerning) 30%, white); color: oklch(38% 0.13 45); }\\n  .header-row { text-align: center; margin-bottom: 28px; }\\n&lt;\\u002Fstyle&gt;\\n\\n&lt;\\u002Fhead&gt;\\n&lt;body&gt;\\n\\n&lt;div class=\\&quot;stage\\&quot;&gt;\\n\\n  &lt;div class=\\&quot;header-row\\&quot;&gt;\\n    &lt;span class=\\&quot;stamp\\&quot;&gt;Artifact #1 · Mobile FTUX&lt;\\u002Fspan&gt;\\n    &lt;h2&gt;Гостевой first-touch — 3 варианта&lt;\\u002Fh2&gt;\\n    &lt;p class=\\&quot;lede\\&quot;&gt;Альтернативы к сцене &lt;code&gt;02-mobile-default-risk.png&lt;\\u002Fcode&gt;. Гость заходит, видит красное пятно МО, не понимает зачем. Цель: за 3 секунды объяснить &lt;i&gt;что это&lt;\\u002Fi&gt; и &lt;i&gt;что делать&lt;\\u002Fi&gt;.&lt;\\u002Fp&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n  &lt;div class=\\&quot;row\\&quot;&gt;\\n\\n    &lt;!-- ==================================================== --&gt;\\n    &lt;!-- VARIANT A — Gamified 3-step                            --&gt;\\n    &lt;!-- Strategy: explicit progress; user sees the journey.    --&gt;\\n    &lt;!-- Sequence: pick region → drop pin → see problems.       --&gt;\\n    &lt;!-- Trade-off: more chrome on top of map.                  --&gt;\\n    &lt;!-- ==================================================== --&gt;\\n    &lt;div&gt;\\n      &lt;div class=\\&quot;phone\\&quot;&gt;&lt;div class=\\&quot;phone-screen\\&quot;&gt;\\n        &lt;div class=\\&quot;phone-notch\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n\\n        &lt;!-- Header --&gt;\\n        &lt;div class=\\&quot;app-header\\&quot;&gt;\\n          &lt;span class=\\&quot;logo gradient-text\\&quot;&gt;PROSTOR&lt;\\u002Fspan&gt;\\n          &lt;button aria-label=\\&quot;Меню\\&quot; class=\\&quot;w-9 h-9 grid place-items-center rounded-md hover:bg-black/5\\&quot;&gt;\\n            &lt;svg width=\\&quot;22\\&quot; height=\\&quot;22\\&quot; viewBox=\\&quot;0 0 24 24\\&quot; fill=\\&quot;none\\&quot; stroke=\\&quot;currentColor\\&quot; stroke-width=\\&quot;1.8\\&quot;&gt;&lt;path d=\\&quot;M4 6h16M4 12h16M4 18h16\\&quot; stroke-linecap=\\&quot;round\\&quot;&gt;&lt;\\u002Fpath&gt;&lt;\\u002Fsvg&gt;\\n          &lt;\\u002Fbutton&gt;\\n        &lt;\\u002Fdiv&gt;\\n\\n        &lt;!-- Map area --&gt;\\n        &lt;div class=\\&quot;relative\\&quot; style=\\&quot;height: 644px;\\&quot;&gt;\\n          &lt;div class=\\&quot;map-bg\\&quot;&gt;&lt;div class=\\&quot;dots\\&quot;&gt;&lt;\\u002Fdiv&gt;&lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- map title chip (left top) --&gt;\\n          &lt;div class=\\&quot;absolute top-3 left-3 right-16 bg-white/95 backdrop-blur rounded-lg px-3 py-2 shadow-sm\\&quot;&gt;\\n            &lt;div class=\\&quot;text-[10px] uppercase tracking-wider text-black/50 leading-none mb-1\\&quot;&gt;Карта качества воды&lt;\\u002Fdiv&gt;\\n            &lt;div class=\\&quot;text-[12px] text-black/80\\&quot;&gt;Москва и Подмосковье · 15&amp;nbsp;504 анализа&lt;\\u002Fdiv&gt;\\n          &lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- step progress (top right of map) --&gt;\\n          &lt;div class=\\&quot;absolute top-3 right-3 bg-white rounded-full shadow-sm flex items-center gap-1 px-2 py-1\\&quot;&gt;\\n            &lt;span class=\\&quot;w-2 h-2 rounded-full\\&quot; style=\\&quot;background: var(--color-primary)\\&quot;&gt;&lt;\\u002Fspan&gt;\\n            &lt;span class=\\&quot;w-2 h-2 rounded-full bg-black/15\\&quot;&gt;&lt;\\u002Fspan&gt;\\n            &lt;span class=\\&quot;w-2 h-2 rounded-full bg-black/15\\&quot;&gt;&lt;\\u002Fspan&gt;\\n          &lt;\\u002Fdiv&gt;\ y); margin-bottom: 4px;\\&quot;&gt;Рекомендация&lt;\\u002Fdiv&gt;\\n    &lt;div style=\\&quot;font: 500 14px/1.6 var(--font-sans); color: var(--color-base-content)\\&quot;&gt;\\n      &lt;b&gt;Variant C&lt;\\u002Fb&gt; для production (lowest risk + сильный uplift по contrast/copy). &lt;b&gt;Variant B&lt;\\u002Fb&gt; — A/B-эксперимент, если CTR&amp;nbsp;на «узнать химию» важнее information-scent. &lt;b&gt;Variant A&lt;\\u002Fb&gt; — для landing-внешней кампании, где у пользователя нулевой контекст.\\n    &lt;\\u002Fdiv&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n&lt;\\u002Fdiv&gt;\\n\\n\\n\\n&lt;\\u002Fbody&gt;&lt;\\u002Fhtml&gt;&quot;\n  &lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\" class=\"artifact-frame tall\" loading=\"lazy\" title=\"FTUX 3 variants\"><\u002Fiframe>\n      <div class=\"artifact-link\">\n        <span>3 variants · 390 × 844<\u002Fspan>\n        <a href=\"01-ftux-mobile.html\" target=\"_blank\">Открыть в отдельной вкладке →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- ARTIFACT 2                                                    -->\n<!-- ============================================================ -->\n<section id=\"a2\">\n  <div class=\"container\">\n    <div class=\"sub\">Artifact #2<\u002Fdiv>\n    <h2>BottomSheet IA — tabs vs accordions<\u002Fh2>\n    <p class=\"desc\">\n      Самая нагруженная mobile-сценка: 7 layer toggles + 6 param-pills + ViewMode + RealEstatePicker + Аналитика по району. Все функции сохранены, scroll-depth уменьшен до ≤2 viewport'ов.\n    <\u002Fp>\n    <div class=\"artifact-card\">\n      <iframe srcdoc=\"&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n&lt;head&gt;\n  &lt;meta charset=&quot;utf-8&quot;&gt;\n  &lt;title&gt;Artifact 2 — BottomSheet IA (2 variants)&lt;/title&gt;\n  &lt;style&gt;\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body { background: #1c4ed8; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }\n    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }\n    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #1c4ed8; z-index: 9999; }\n    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }\n    #__bundler_placeholder { color: #999; font-size: 14px; }\n  &lt;/style&gt;\n  &lt;noscript&gt;\n    &lt;style&gt;#__bundler_loading { display: none; }&lt;/style&gt;\n    &lt;div style=&quot;position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;&quot;&gt;\n      This page requires JavaScript to display.\n    &lt;/div&gt;\n  &lt;/noscript&gt;\n&lt;/head&gt;\n&lt;body&gt;\n  &lt;div id=&quot;__bundler_thumbnail&quot;&gt;\n  &lt;svg viewBox=&quot;0 0 600 400&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;\n    &lt;rect width=&quot;600&quot; height=&quot;400&quot; fill=&quot;#1c4ed8&quot;&gt;&lt;/rect&gt;\n    &lt;text x=&quot;300&quot; y=&quot;220&quot; text-anchor=&quot;middle&quot; font-family=&quot;Montserrat, sans-serif&quot; font-weight=&quot;800&quot; font-size=&quot;200&quot; fill=&quot;#ffffff&quot; letter-spacing=&quot;0.04em&quot;&gt;IA&lt;/text&gt;\n    &lt;text x=&quot;300&quot; y=&quot;320&quot; text-anchor=&quot;middle&quot; font-family=&quot;Montserrat, sans-serif&quot; font-weight=&quot;600&quot; font-size=&quot;22&quot; fill=&quot;#ffffff&quot; opacity=&quot;0.7&quot; letter-spacing=&quot;0.15em&quot;&gt;PROSTOR&lt;/text&gt;\n  &lt;/svg&gt;\n&lt;/div&gt;\n  &lt;div id=&q  {\\n  --color-primary:  oklch(54% 0.245 262.881);\\n  --color-primary-content: #fff;\\n  --color-base-100: #fff;\\n  --color-base-200: oklch(98% 0 0);\\n  --color-base-300: oklch(95% 0 0);\\n  --color-base-content: oklch(21% 0.006 285.885);\\n  --color-success: oklch(76% 0.177 163.223);\\n  --color-warning: oklch(82% 0.189 84.429);\\n  --color-error:   oklch(71% 0.194 13.428);\\n\\n  /* Severity scale */\\n  --sev-safe:        oklch(72% 0.16 150);\\n  --sev-borderline:  oklch(82% 0.16 95);\\n  --sev-concerning:  oklch(72% 0.18 50);\\n  --sev-unsafe:      oklch(62% 0.22 25);\\n\\n  /* Aquifer (refreshed — no severity-green conflict) */\\n  --aq-verkhovodka:  oklch(50% 0.09 55);   /* terracotta */\\n  --aq-pesch:        oklch(68% 0.12 95);   /* khaki / sand */\\n  --aq-pesch-izv:    oklch(70% 0.10 195);  /* teal */\\n  --aq-izv:          oklch(55% 0.18 250);  /* strong blue */\\n  --aq-artezian:     oklch(48% 0.20 305);  /* deep purple */\\n\\n  /* Type */\\n  --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\\n}\\n\\nhtml, body {\\n  font-family: var(--font-sans);\\n  color: var(--color-base-content);\\n  -webkit-font-smoothing: antialiased;\\n}\\n\\n.gradient-text {\\n  background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n  -webkit-background-clip: text; background-clip: text; color: transparent;\\n}\\n\\n/* ============================================================\\n   Map placeholder — looks like CARTO Voyager + heatmap stack\\n   Drop this on a full-bleed div with class .map-bg\\n   ============================================================ */\\n.map-bg {\\n  position: absolute; inset: 0;\\n  background:\\n    /* heatmap blobs (red / orange / yellow / green) */\\n    radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n    radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n    radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n    radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n    radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n    radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n    radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n    radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%),\\n    /* basemap tone (CARTO Voyager cream) */\\n    linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\n}\\n.map-bg::after {\\n  /* faint road/grid hint */\\n  content: '';\\n  position: absolute; inset: 0;\\n  background-image:\\n    linear-gradient(60deg, rgba(0,0,0,.04) 1px, transparent 1px),\\n    linear-gradient(-60deg, rgba(0,0,0,.04) 1px, transparent 1px);\\n  background-size: 80px 80px, 80px 80px;\\n  pointer-events: none;\\n}\\n.map-bg .dots {\\n  position: absolute; inset: 0;\\n  background-image:\\n    radial-gradient(circle 2px at 18% 22%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 32% 30%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 44% 40%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 56% 48%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 30% 62%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 62% 65%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 72% 50%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 48% 70%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 78% 30%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 26% 48%, var(--sev-unsafe) 100%, transparent 0);\\n}\\n.map-label {\\n  position: absolute;\\n  font: 500 11px var(--font-sans);\\n  color: rgba(60, 60, 70, 0.55);\\n  letter-spacing: 0.04em;\\n  text-transform: uppercase;\\n  pointer-events: none;\\n}\\n\\n/* Severity dot */\\n.sev-dot {\\n  display: inline-block; width: 8px; height: 8px; border-radius: 999px;\\n  flex-shrink: 0;\\n}\\n.sev-dot.safe       { background: var(--sev-safe); }\\n.sev-dot.borderline { background: var(--sev-borderline); }\\n.sev-dot.concerning { background: var(--sev-concerning); }\\n.sev-dot.unsafe     { background: var(--sev-unsafe); }\\n\\n/* Severity chip */\\n.sev-chip {\\n  display: inline-flex; align-items: center; gap: 6px;\\n  padding: 4px 10px; border-radius: 999px;\\n  font: 500 12px var(--font-sans);\\n}\\n.sev-chip.unsafe     { background: color-mix(in oklch, var(--sev-unsafe) 18%, white); color: oklch(35% 0.15 25); }\\n.sev-chip.concerning { background: color-mix(in oklch, var(--sev-concerning) 22%, white); color: oklch(38% 0.13 50); }\\n.sev-chip.borderline { background: color-mix(in oklch, var(--sev-borderline) 30%, white); color: oklch(40% 0.10 80); }\\n.sev-chip.safe       { background: color-mix(in oklch, var(--sev-safe) 28%, white); color: oklch(38% 0.10 165); }\\n\\n/* Phone frame */\\n.phone {\\n  width: 390px; height: 844px;\\n  border-radius: 44px;\\n  background: #000;\\n  padding: 10px;\\n  box-shadow: 0 30px 60px -20px rgba(20,30,60,.25), 0 0 0 1px rgba(0,0,0,.04);\\n  position: relative;\\n}\\n.phone-screen {\\n  width: 100%; height: 100%;\\n  border-radius: 36px; overflow: hidden;\\n  background: #fff; position: relative;\\n}\\n.phone-notch {\\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\\n  width: 110px; height: 28px; background: #000; border-radius: 999px; z-index: 50;\\n}\\n\\n/* App-chrome (header + dock) */\\n.app-header {\\n  height: 56px; padding: 0 16px;\\n  display: flex; align-items: center; justify-content: space-between;\\n  background: #fff; border-bottom: 1px solid rgba(0,0,0,.06);\\n  position: relative; z-index: 30;\\n}\\n.app-header .logo {\\n  font: 800 17px var(--font-sans); letter-spacing: 0.02em;\\n}\\n.app-dock {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 72px; background: #fff;\\n  display: grid; grid-template-columns: 56px 1fr 1fr 1fr;\\n  align-items: center; padding: 0 8px;\\n  box-shadow: 0 -1px 3px 0 rgba(0,0,0,.06);\\n  z-index: 30;\\n}\\n.app-dock .avatar {\\n  width: 36px; height: 36px; border-radius: 999px; background: #1a1a1a; color: #fff;\\n  display: grid; place-items: center; font: 600 13px var(--font-sans);\\n}\\n.dock-tab {\\n  display: flex; flex-direction: column; align-items: center; gap: 2px;\\n  font: 500 11px var(--font-sans); color: oklch(40% 0.005 285);\\n}\\n.dock-tab.active { color: var(--color-primary); }\\n.dock-tab .ico { width: 20px; height: 20px; }\\n.dock-tab.active::after {\\n  content: ''; width: 24px; height: 2px; border-radius: 999px;\\n  background: var(--color-base-content); margin-top: 2px;\\n}\\n&lt;\\u002Fstyle&gt;\\n&lt;style&gt;\\n  body { background: oklch(97% 0.005 250); padding: 32px 16px 80px; }\\n  .stage { max-width: 1100px; margin: 0 auto; }\\n  .row { display: grid; grid-template-columns: repeat(2, 390px); gap: 40px; justify-content: center; }\\n  @media (max-width: 880px) { .row { grid-template-columns: 1fr; gap: 64px; } }\\n  .caption { color: oklch(40% 0.005 285); font-size: 13px; line-height: 1.6; max-width: 390px; margin: 12px auto 0; text-align:center; }\\n  .caption b { color: var(--color-base-content); }\\n  .stamp { display:inline-block; font: 600 10px var(--font-sans); letter-spacing:0.1em; text-transform:uppercase;\\n           color: var(--color-primary); padding: 3px 8px; border-radius: 999px;\\n           background: color-mix(in oklch, var(--color-primary) 10%, white); margin-bottom: 8px; }\\n  h2 { font: 700 28px var(--font-sans); letter-spacing: -0.01em; margin: 0 0 4px; }\\n  .lede { color: oklch(45% 0.005 285); font-size: 15px; max-width: 720px; margin: 0 auto 36px; text-align: center; }\\n  .header-row { text-align: center; margin-bottom: 28px; }\\n  .trade-offs { margin-top: 12px; display: grid; gap: 6px; max-width: 390px; margin-left: auto; margin-right: auto; }\\n  .trade-offs &gt; div { display: flex; gap: 8px; align-items: flex-start; }\\n  .trade-offs .badge {\\n    flex: 0 0 auto; font: 600 9px var(--font-sans); letter-spacing: .05em; text-transform: uppercase;\\n    padding: 2px 6px; border-radius: 4px; margin-top: 1px;\\n  }\\n  .trade-offs .badge.pro { background: color-mix(in oklch, var(--sev-safe) 25%, white); color: oklch(35% 0.12 165); }\\n  .trade-offs .badge.con { background: color-mix(in oklch, var(--sev-concerning) 30%, white); color: oklch(38% 0.13 45); }\\n  .pro { color: oklch(38% 0.10 165); font-size:12px; }\\n  .con { color: oklch(40% 0.13 25); font-size:12px; }\\n\\n  /* Sheet styles */\\n  .sheet {\\n    position: absolute; left: 0; right: 0; bottom: 0;\\n    background: #fff; border-top-left-radius: 24px; border-top-right-radius: 24px;\\n    box-shadow: 0 -8px 24px rgba(0,0,0,.08);\\n    overflow: hidden;\\n  }\\n  .grip { width: 36px; height: 4px; border-radius: 999px; background: oklch(85% 0 0); margin: 8px auto 4px; }\\n  .pill {\\n    display:inline-flex; align-items:center; gap: 4px;\\n    height: 30px; padding: 0 12px; border-radius: 999px;\\n    font: 500 12px var(--font-sans);\\n    border: 1px solid oklch(90% 0 0); color: var(--color-base-content);\\n    white-space: nowrap;\\n  }\\n  .pill.active {\\n    background: var(--color-primary); color: #fff; border-color: var(--color-primary);\\n  }\\n  .toggle {\\n    position: relative; width: 36px; height: 20px; border-radius: 999px;\\n    background: oklch(90% 0 0); flex-shrink:0; transition: background .15s;\\n  }\\n  .toggle::after {\\n    content:''; position:absolute; top: 2px; left: 2px; width: 16px; height: 16px;\\n    border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2);\\n    transition: left .15s;\\n  }\\n  .toggle.on { background: var(--color-primary); }\\n  .toggle.on::after { left: 18px; }\\n\\n  .tab {\\n    flex: 1; padding: 12px 8px; font: 500 13px var(--font-sans);\\n    color: oklch(45% 0.005 285); text-align:center;\\n    border-bottom: 2px solid transparent;\\n  }\\n  .tab.active { color: var(--color-primary); border-color: var(--color-primary); font-weight:600; }\\n\\n  .row-toggle {\\n    display: flex; align-items: flex-start; gap: 12px;\\n    padding: 10px 16px; cursor: pointer;\\n  }\\n  .row-toggle .label { flex: 1; min-width: 0; }\\n  .row-toggle .label .t { font: 500 13.5px var(--font-sans); }\\n  .row-toggle .label .d { font: 400 11px/1.4 var(--font-sans); color: oklch(45% 0.005 285); margin-top: 2px; }\\n\\n  details &gt; summary { list-style: none; cursor: pointer; }\\n  details &gt; summary::-webkit-details-marker { display: none; }\\n&lt;\\u002Fstyle&gt;\\n\\n&lt;\\u002Fhead&gt;\\n&lt;body&gt;\\n\\n&lt;div class=\\&quot;stage\\&quot;&gt;\\n\\n  &lt;div class=\\&quot;header-row\\&quot;&gt;\\n    &lt;span class=\\&quot;stamp\\&quot;&gt;Artifact #2 · BottomSheet IA&lt;\\u002Fspan&gt;\\n    &lt;h2&gt;Mobile-layer panel — две альтернативы&lt;\\u002Fh2&gt;\\n    &lt;p class=\\&quot;lede\\&quot;&gt;Сцена &lt;code&gt;18-mobile-bottom-sheet-layers.png&lt;\\u002Fcode&gt;: 7 toggle'ей + 6 pills + ViewMode + RealEstatePicker + Аналитика. Сейчас ~1500&amp;nbsp;px scroll. Цель: ≤2 viewport'а без удаления функций.&lt;\\u002Fp&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n  &lt;div class=\\&quot;row\\&quot;&gt;\\n\\n    &lt;!-- ============================================== --&gt;\\n    &lt;!-- VARIANT A — Tabs (Слои / Параметры / Магазины / Аналитика) --&gt;\\n    &lt;!-- ============================================== --&gt;\\n    &lt;div&gt;\\n      &lt;div class=\\&quot;phone\\&quot;&gt;&lt;div class=\\&quot;phone-screen\\&quot;&gt;\\n        &lt;div class=\\&quot;phone-notch\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n\\n        &lt;div class=\\&quot;app-header\\&quot;&gt;\\n          &lt;span class=\\&quot;logo gradient-text\\&quot;&gt;PROSTOR&lt;\\u002Fspan&gt;\\n          &lt;button aria-label=\\&quot;Меню\ sch:        oklch(68% 0.12 95);   /* khaki / sand */\\n  --aq-pesch-izv:    oklch(70% 0.10 195);  /* teal */\\n  --aq-izv:          oklch(55% 0.18 250);  /* strong blue */\\n  --aq-artezian:     oklch(48% 0.20 305);  /* deep purple */\\n\\n  /* Type */\\n  --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\\n}\\n\\nhtml, body {\\n  font-family: var(--font-sans);\\n  color: var(--color-base-content);\\n  -webkit-font-smoothing: antialiased;\\n}\\n\\n.gradient-text {\\n  background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n  -webkit-background-clip: text; background-clip: text; color: transparent;\\n}\\n\\n/* ============================================================\\n   Map placeholder — looks like CARTO Voyager + heatmap stack\\n   Drop this on a full-bleed div with class .map-bg\\n   ============================================================ */\\n.map-bg {\\n  position: absolute; inset: 0;\\n  background:\\n    /* heatmap blobs (red / orange / yellow / green) */\\n    radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n    radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n    radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n    radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n    radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n    radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n    radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n    radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%),\\n    /* basemap tone (CARTO Voyager cream) */\\n    linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\n}\\n.map-bg::after {\\n  /* faint road/grid hint */\\n  content: '';\\n  position: absolute; inset: 0;\\n  background-image:\\n    linear-gradient(60deg, rgba(0,0,0,.04) 1px, transparent 1px),\\n    linear-gradient(-60deg, rgba(0,0,0,.04) 1px, transparent 1px);\\n  background-size: 80px 80px, 80px 80px;\\n  pointer-events: none;\\n}\\n.map-bg .dots {\\n  position: absolute; inset: 0;\\n  background-image:\\n    radial-gradient(circle 2px at 18% 22%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 32% 30%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 44% 40%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 56% 48%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 30% 62%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 62% 65%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 72% 50%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 48% 70%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 78% 30%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 26% 48%, var(--sev-unsafe) 100%, transparent 0);\\n}\\n.map-label {\\n  position: absolute;\\n  font: 500 11px var(--font-sans);\\n  color: rgba(60, 60, 70, 0.55);\\n  letter-spacing: 0.04em;\\n  text-transform: uppercase;\\n  pointer-events: none;\\n}\\n\\n/* Severity dot */\\n.sev-dot {\\n  display: inline-block; width: 8px; height: 8px; border-radius: 999px;\\n  flex-shrink: 0;\\n}\\n.sev-dot.safe       { background: var(--sev-safe); }\\n.sev-dot.borderline { background: var(--sev-borderline); }\\n.sev-dot.concerning { background: var(--sev-concerning); }\\n.sev-dot.unsafe     { background: var(--sev-unsafe); }\\n\\n/* Severity chip */\\n.sev-chip {\\n  display: inline-flex; align-items: center; gap: 6px;\\n  padding: 4px 10px; border-radius: 999px;\\n  font: 500 12px var(--font-sans);\\n}\\n.sev-chip.unsafe     { background: color-mix(in oklch, var(--sev-unsafe) 18%, white); color: oklch(35% 0.15 25); }\\n.sev-chip.concerning { background: color-mix(in oklch, var(--sev-concerning) 22%, white); color: oklch(38% 0.13 50); }\\n.sev-chip.borderline { background: color-mix(in oklch, var(--sev-borderline) 30%, white); color: oklch(40% 0.10 80); }\\n.sev-chip.safe       { background: color-mix(in oklch, var(--sev-safe) 28%, white); color: oklch(38% 0.10 165); }\\n\\n/* Phone frame */\\n.phone {\\n  width: 390px; height: 844px;\\n  border-radius: 44px;\\n  background: #000;\\n  padding: 10px;\\n  box-shadow: 0 30px 60px -20px rgba(20,30,60,.25), 0 0 0 1px rgba(0,0,0,.04);\\n  position: relative;\\n}\\n.phone-screen {\\n  width: 100%; height: 100%;\\n  border-radius: 36px; overflow: hidden;\\n  background: #fff; position: relative;\\n}\\n.phone-notch {\\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\\n  width: 110px; height: 28px; background: #000; border-radius: 999px; z-index: 50;\\n}\\n\\n/* App-chrome (header + dock) */\\n.app-header {\\n  height: 56px; padding: 0 16px;\\n  display: flex; align-items: center; justify-content: space-between;\\n  background: #fff; border-bottom: 1px solid rgba(0,0,0,.06);\\n  position: relative; z-index: 30;\\n}\\n.app-header .logo {\\n  font: 800 17px var(--font-sans); letter-spacing: 0.02em;\\n}\\n.app-dock {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 72px; background: #fff;\\n  display: grid; grid-template-columns: 56px 1fr 1fr 1fr;\\n  align-items: center; padding: 0 8px;\\n  box-shadow: 0 -1px 3px 0 rgba(0,0,0,.06);\\n  z-index: 30;\\n}\\n.app-dock .avatar {\\n  width: 36px; height: 36px; border-radius: 999px; background: #1a1a1a; color: #fff;\\n  display: grid; place-items: center; font: 600 13px var(--font-sans);\\n}\\n.dock-tab {\\n  display: flex; flex-direction: column; align-items: center; gap: 2px;\\n  font: 500 11px var(--font-sans); color: oklch(40% 0.005 285);\\n}\\n.dock-tab.active { color: var(--color-primary); }\\n.dock-tab .ico { width: 20px; height: 20px; }\\n.dock-tab.active:: rderline:  oklch(82% 0.16 95);\\n  --sev-concerning:  oklch(72% 0.18 50);\\n  --sev-unsafe:      oklch(62% 0.22 25);\\n\\n  /* Aquifer (refreshed — no severity-green conflict) */\\n  --aq-verkhovodka:  oklch(50% 0.09 55);   /* terracotta */\\n  --aq-pesch:        oklch(68% 0.12 95);   /* khaki / sand */\\n  --aq-pesch-izv:    oklch(70% 0.10 195);  /* teal */\\n  --aq-izv:          oklch(55% 0.18 250);  /* strong blue */\\n  --aq-artezian:     oklch(48% 0.20 305);  /* deep purple */\\n\\n  /* Type */\\n  --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\\n}\\n\\nhtml, body {\\n  font-family: var(--font-sans);\\n  color: var(--color-base-content);\\n  -webkit-font-smoothing: antialiased;\\n}\\n\\n.gradient-text {\\n  background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n  -webkit-background-clip: text; background-clip: text; color: transparent;\\n}\\n\\n/* ============================================================\\n   Map placeholder — looks like CARTO Voyager + heatmap stack\\n   Drop this on a full-bleed div with class .map-bg\\n   ============================================================ */\\n.map-bg {\\n  position: absolute; inset: 0;\\n  background:\\n    /* heatmap blobs (red / orange / yellow / green) */\\n    radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n    radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n    radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n    radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n    radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n    radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n    radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n    radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%),\\n    /* basemap tone (CARTO Voyager cream) */\\n    linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\n}\\n.map-bg::after {\\n  /* faint road/grid hint */\\n  content: '';\\n  position: absolute; inset: 0;\\n  background-image:\\n    linear-gradient(60deg, rgba(0,0,0,.04) 1px, transparent 1px),\\n    linear-gradient(-60deg, rgba(0,0,0,.04) 1px, transparent 1px);\\n  background-size: 80px 80px, 80px 80px;\\n  pointer-events: none;\\n}\\n.map-bg .dots {\\n  position: absolute; inset: 0;\\n  background-image:\\n    radial-gradient(circle 2px at 18% 22%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 32% 30%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 44% 40%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 56% 48%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 30% 62%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 62% 65%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 72% 50%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 48% 70%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 78% 30%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 26% 48%, var(--sev-unsafe) 100%, transparent 0);\\n}\\n.map-label {\\n  position: absolute;\\n  font: 500 11px var(--font-sans);\\n  color: rgba(60, 60, 70, 0.55);\\n  letter-spacing: 0.04em;\\n  text-transform: uppercase;\\n  pointer-events: none;\\n}\\n\\n/* Severity dot */\\n.sev-dot {\\n  display: inline-block; width: 8px; height: 8px; border-radius: 999px;\\n  flex-shrink: 0;\\n}\\n.sev-dot.safe       { background: var(--sev-safe); }\\n.sev-dot.borderline { background: var(--sev-borderline); }\\n.sev-dot.concerning { background: var(--sev-concerning); }\\n.sev-dot.unsafe     { background: var(--sev-unsafe); }\\n\\n/* Severity chip */\\n.sev-chip {\\n  display: inline-flex; align-items: center; gap: 6px;\\n  padding: 4px 10px; border-radius: 999px;\\n  font: 500 12px var(--font-sans);\\n}\\n.sev-chip.unsafe     { background: color-mix(in oklch, var(--sev-unsafe) 18%, white); color: oklch(35% 0.15 25); }\\n.sev-chip.concerning { background: color-mix(in oklch, var(--sev-concerning) 22%, white); color: oklch(38% 0.13 50); }\\n.sev-chip.borderline { background: color-mix(in oklch, var(--sev-borderline) 30%, white); color: oklch(40% 0.10 80); }\\n.sev-chip.safe       { background: color-mix(in oklch, var(--sev-safe) 28%, white); color: oklch(38% 0.10 165); }\\n\\n/* Phone frame */\\n.phone {\\n  width: 390px; height: 844px;\\n  border-radius: 44px;\\n  background: #000;\\n  padding: 10px;\\n  box-shadow: 0 30px 60px -20px rgba(20,30,60,.25), 0 0 0 1px rgba(0,0,0,.04);\\n  position: relative;\\n}\\n.phone-screen {\\n  width: 100%; height: 100%;\\n  border-radius: 36px; overflow: hidden;\\n  background: #fff; position: relative;\\n}\\n.phone-notch {\\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\\n  width: 110px; height: 28px; background: #000; border-radius: 999px; z-index: 50;\\n}\\n\\n/* App-chrome (header + dock) */\\n.app-header {\\n  height: 56px; padding: 0 16px;\\n  display: flex; align-items: center; justify-content: space-between;\\n  background: #fff; border-bottom: 1px solid rgba(0,0,0,.06);\\n  position: relative; z-index: 30;\\n}\\n.app-header .logo {\\n  font: 800 17px var(--font-sans); letter-spacing: 0.02em;\\n}\\n.app-dock {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 72px; background: #fff;\\n  display: grid; grid-template-columns: 56px 1fr 1fr 1fr;\\n  align-items: center; padding: 0 8px;\\n  box-shadow: 0 -1px 3px 0 rgba(0,0,0,.06);\\n  z-index: 30;\\n}\\n.app-dock .avatar {\\n  width: 36px; height: 36px; border-radius: 999px; background: #1a1a1a; color: #fff;\\n  display: grid; place-items: center; font: 600 13px var(--font-sans);\\n}\\n.dock-tab {\\n  display: t;meta charset=\\&quot;utf-8\\&quot;&gt;\\n&lt;meta name=\\&quot;viewport\\&quot; content=\\&quot;width=device-width, initial-scale=1, viewport-fit=cover\\&quot;&gt;\\n&lt;title&gt;Artifact 5 — Wow-moment splash&lt;\\u002Ftitle&gt;\\n&lt;script src=\\&quot;6a0e397e-96aa-4ed5-aea3-ca7c266dd807\\&quot;&gt;&lt;\\u002Fscript&gt;\\n&lt;style&gt;/* ============================================================\\n   PROSTOR water-map review — shared map placeholder + tokens\\n   ============================================================ */\\n\\n:root {\\n  --color-primary:  oklch(54% 0.245 262.881);\\n  --color-primary-content: #fff;\\n  --color-base-100: #fff;\\n  --color-base-200: oklch(98% 0 0);\\n  --color-base-300: oklch(95% 0 0);\\n  --color-base-content: oklch(21% 0.006 285.885);\\n  --color-success: oklch(76% 0.177 163.223);\\n  --color-warning: oklch(82% 0.189 84.429);\\n  --color-error:   oklch(71% 0.194 13.428);\\n\\n  /* Severity scale */\\n  --sev-safe:        oklch(72% 0.16 150);\\n  --sev-borderline:  oklch(82% 0.16 95);\\n  --sev-concerning:  oklch(72% 0.18 50);\\n  --sev-unsafe:      oklch(62% 0.22 25);\\n\\n  /* Aquifer (refreshed — no severity-green conflict) */\\n  --aq-verkhovodka:  oklch(50% 0.09 55);   /* terracotta */\\n  --aq-pesch:        oklch(68% 0.12 95);   /* khaki / sand */\\n  --aq-pesch-izv:    oklch(70% 0.10 195);  /* teal */\\n  --aq-izv:          oklch(55% 0.18 250);  /* strong blue */\\n  --aq-artezian:     oklch(48% 0.20 305);  /* deep purple */\\n\\n  /* Type */\\n  --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\\n}\\n\\nhtml, body {\\n  font-family: var(--font-sans);\\n  color: var(--color-base-content);\\n  -webkit-font-smoothing: antialiased;\\n}\\n\\n.gradient-text {\\n  background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n  -webkit-background-clip: text; background-clip: text; color: transparent;\\n}\\n\\n/* ============================================================\\n   Map placeholder — looks like CARTO Voyager + heatmap stack\\n   Drop this on a full-bleed div with class .map-bg\\n   ============================================================ */\\n.map-bg {\\n  position: absolute; inset: 0;\\n  background:\\n    /* heatmap blobs (red / orange / yellow / green) */\\n    radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n    radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n    radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n    radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n    radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n    radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n    radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n    radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%),\\n    /* basemap tone (CARTO Voyager cream) */\\n    linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\n}\\n.map-bg::after {\\n  /* faint road/grid hint */\\n  content: '';\\n  position: absolute; inset: 0;\\n  background-image:\\n    linear-gradient(60deg, rgba(0,0,0,.04) 1px, transparent 1px),\\n    linear-gradient(-60deg, rgba(0,0,0,.04) 1px, transparent 1px);\\n  background-size: 80px 80px, 80px 80px;\\n  pointer-events: none;\\n}\\n.map-bg .dots {\\n  position: absolute; inset: 0;\\n  background-image:\\n    radial-gradient(circle 2px at 18% 22%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 32% 30%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 44% 40%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 56% 48%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 30% 62%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 62% 65%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 72% 50%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 48% 70%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 78% 30%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 26% 48%, var(--sev-unsafe) 100%, transparent 0);\\n}\\n.map-label {\\n  position: absolute;\\n  font: 500 11px var(--font-sans);\\n  color: rgba(60, 60, 70, 0.55);\\n  letter-spacing: 0.04em;\\n  text-transform: uppercase;\\n  pointer-events: none;\\n}\\n\\n/* Severity dot */\\n.sev-dot {\\n  display: inline-block; width: 8px; height: 8px; border-radius: 999px;\\n  flex-shrink: 0;\\n}\\n.sev-dot.safe       { background: var(--sev-safe); }\\n.sev-dot.borderline { background: var(--sev-borderline); }\\n.sev-dot.concerning { background: var(--sev-concerning); }\\n.sev-dot.unsafe     { background: var(--sev-unsafe); }\\n\\n/* Severity chip */\\n.sev-chip {\\n  display: inline-flex; align-items: center; gap: 6px;\\n  padding: 4px 10px; border-radius: 999px;\\n  font: 500 12px var(--font-sans);\\n}\\n.sev-chip.unsafe     { background: color-mix(in oklch, var(--sev-unsafe) 18%, white); color: oklch(35% 0.15 25); }\\n.sev-chip.concerning { background: color-mix(in oklch, var(--sev-concerning) 22%, white); color: oklch(38% 0.13 50); }\\n.sev-chip.borderline { background: color-mix(in oklch, var(--sev-borderline) 30%, white); color: oklch(40% 0.10 80); }\\n.sev-chip.safe       { background: color-mix(in oklch, var(--sev-safe) 28%, white); color: oklch(38% 0.10 165); }\\n\\n/* Phone frame */\\n.phone {\\n  width: 390px; height: 844px;\\n  border-radius: 44px;\\n  background: #000;\\n  padding: 10px;\\n  box-shadow: 0 30px 60px -20px rgba(20,30,60,.25), 0 0 0 1px rgba(0,0,0,.04);\\n  position: relative;\\n}\\n.phone-screen {\\n  width: 100%; height: 100%;\\n  border-radius: 36px; overflow: hidden;\\n  background: #fff; position: relative;\\n}\\n.phone-notch {\\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\\n  width: 110px; height: 28px; background: #000; border-radius: 999px; z-index: 50;\\n}\\n\\n/* App-chrome (header + dock) */\\n.app-header {\\n  height: 56px; padding: 0 16px;\\n  display: flex; align-items: center; justify-content: space-between;\\n  background: #fff; border-bottom: 1px solid rgba(0,0,0,.06);\\n  position: relative; z-index: 30;\\n}\\n.app-header .logo {\\n  font: 800 17px var(--font-sans); letter-spacing: 0.02em;\\n}\\n.app-dock {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 72px; background: #fff;\\n  display: grid; grid-template-columns: 56px 1fr 1fr 1fr;\\n  align-items: center; padding: 0 8px;\\n  box-shadow: 0 -1px 3px 0 rgba(0,0,0,.06);\\n  z-index: 30;\\n}\\n.app-dock .avatar {\\n  width: 36px; height: 36px; border-radius: 999px; background: #1a1a1a; color: #fff;\\n  display: grid; place-items: center; font: 600 13px var(--font-sans);\\n}\\n.dock-tab {\\n  display: flex; flex-direction: column; align-items: center; gap: 2px;\\n  font: 500 11px var(--font-sans); color: oklch(40% 0.005 285);\\n}\\n.dock-tab.active { color: var(--color-primary); }\\n.dock-tab .ico { width: 20px; height: 20px; }\\n.dock-tab.active::after {\\n  content: ''; width: 24px; height: 2px; border-radius: 999px;\\n  background: var(--color-base-content); margin-top: 2px;\\n}\\n&lt;\\u002Fstyle&gt;\\n&lt;style&gt;\\n  body { background: oklch(96% 0.005 250); padding: 32px 16px 80px; }\\n  .stage { max-width: 1100px; margin: 0 auto; }\\n  .stamp { display:inline-block; font: 600 10px var(--font-sans); letter-spacing:0.1em; text-transform:uppercase;\\n           color: var(--color-primary); padding: 3px 8px; border-radius: 999px;\\n           background: color-mix(in oklch, var(--color-primary) 10%, white); margin-bottom: 8px; }\\n  h2 { font: 700 28px var(--font-sans); letter-spacing: -0.01em; margin: 0 0 4px; }\\n  .lede { color: oklch(45% 0.005 285); font-size: 15px; max-width: 720px; margin: 0 auto 28px; text-align: center; }\\n  .header-row { text-align: center; margin-bottom: 28px; }\\n  .controls {\\n    display: flex; gap: 8px; justify-content: center; margin-bottom: 24px;\\n  }\\n  .controls button {\\n    height: 36px; padding: 0 16px; border-radius: 8px;\\n    font: 500 13px var(--font-sans);\\n    background: white; border: 1px solid oklch(90% 0 0); cursor: pointer;\\n  }\\n  .controls button.primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }\\n\\n  .demo-row { display: grid; grid-template-columns: 390px 1fr; gap: 32px; justify-content: center; align-items: start; }\\n  @media (max-width: 880px) { .demo-row { grid-template-columns: 1fr; } }\\n\\n  /* ===================================================\\n     ANIMATION TIMELINE (driven by class on .stage-screen)\\n     0.0–0.4s  curtain fade out, logo fades in (already on)\\n     0.4–1.0s  drop falls, splashes\\n     1.0–1.4s  heatmap blooms (radial reveal)\\n     1.4–1.9s  pin drops with ripple\\n     1.9–2.4s  red cell pulses, counter ticks\\n     =================================================== */\\n\\n  .stage-screen {\\n    width: 100%; height: 100%; position: relative; overflow: hidden;\\n    background: #f8f5ef;\\n  }\\n\\n  /* Curtain — slides up reveals map */\\n  .curtain {\\n    position: absolute; inset: 0; background: var(--color-primary);\\n    z-index: 30;\\n    transform: translateY(0);\\n  }\\n  .play .curtain {\\n    animation: curtainExit 0.6s 0.4s cubic-bezier(.7,0,.2,1) forwards;\\n  }\\n  @keyframes curtainExit {\\n    0%   { transform: translateY(0); border-radius: 0; }\\n    60%  { transform: translateY(-90%); border-radius: 0 0 50% 50% / 0 0 25% 25%; }\\n    100% { transform: translateY(-110%); border-radius: 0 0 50% 50% / 0 0 25% 25%; }\\n  }\\n\\n  /* Logo on curtain */\\n  .curtain-logo {\\n    position: absolute; top: 38%; left: 0; right: 0;\\n    text-align: center; color: white;\\n    font: 800 32px var(--font-sans); letter-spacing: 0.04em;\\n    opacity: 0;\\n  }\\n  .play .curtain-logo {\\n    animation: logoIn 0.6s 0.0s ease forwards, logoOut 0.3s 0.6s ease forwards;\\n  }\\n  @keyframes logoIn  { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }\\n  @keyframes logoOut { to   { opacity: 0; transform: translateY(-8px) } }\\n\\n  /* Water drop falling */\\n  .drop {\\n    position: absolute; left: 50%; top: 8%;\\n    width: 28px; height: 32px;\\n    transform: translate(-50%, -200%) scale(1);\\n    opacity: 0;\\n    z-index: 25;\\n    pointer-events: none;\\n  }\\n  .drop svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 8px rgba(28, 78, 216, .4)); }\\n  .play .drop {\\n    animation: dropFall 0.55s 0.6s cubic-bezier(.5,0,.7,1) forwards,\\n               dropSplash 0.18s 1.15s ease forwards;\\n  }\\n  @keyframes dropFall {\\n    0%   { transform: translate(-50%, -200%) scale(0.6); opacity: 0; }\\n    20%  { opacity: 1; }\\n    90%  { transform: translate(-50%, 240%) scale(1, 1.2); opacity: 1; }\\n    100% { transform: translate(-50%, 320%) scale(1.4, 0.5); opacity: 1; }\\n  }\\n  @keyframes dropSplash {\\n    to { opacity: 0; transform: translate(-50%, 320%) scale(2, 0.1); }\\n  }\\n\\n  /* Heatmap reveal — radial mask */\\n  .heat {\\n    position: absolute; inset: 0;\\n    background:\\n      radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n      radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n      radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n      radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n      radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n      radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n      radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n      radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%);\\n    -webkit-mask: radial-gradient(circle at 50% 50%, black 0%, black 0%, transparent 0%);\\n    mask: radial-gradient(circle at 50% 50%, black 0%, black 0%, transparent 0%);\\n  }\\n  .play .heat {\\n    animation: heatReveal 0.7s 1.2s cubic-bezier(.4,0,.4,1) forwards;\\n  }\\n  @keyframes heatReveal {\\n    to {\\n      -webkit-mask: radial-gradient(circle at 50% 50%, black 0%, black 80%, transparent 100%);\\n      mask: radial-gradient(circle at 50% 50%, black 0%, black 80%, transparent 100%);\\n    }\\n  }\\n\\n  /* Pin drop on Kashira (~50% / 60%) */\\n  .pin-drop {\\n    position: absolute; left: 50%; top: 56%;\\n    width: 36px; height: 44px;\\n    transform: translate(-50%, -100%) scale(0);\\n    z-index: 20;\\n    opacity: 0;\\n  }\\n  .pin-drop svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 12px rgba(0,0,0,.25)); }\\n  .play .pin-drop {\\n    animation: pinDrop 0.5s 1.7s cubic-bezier(.3, 1.5, .5, 1) forwards;\\n  }\\n  @keyframes pinDrop {\\n    0%   { transform: translate(-50%, -200%) scale(0.6); opacity: 0; }\\n    50%  { transform: translate(-50%, -100%) scale(1.15); opacity: 1; }\\n    75%  { transform: translate(-50%, -100%) scale(0.92); }\\n    100% { transform: translate(-50%, -100%) scale(1);    opacity: 1; }\\n  }\\n\\n  /* Ripple around pin */\\n  .ripple {\\n    position: absolute; left: 50%; top: 56%;\\n    width: 0; height: 0;\\n    border: 2px solid var(--color-primary);\\n    border-radius: 999px;\\n    transform: translate(-50%, -50%);\\n    opacity: 0;\\n    z-index: 15;\\n  }\\n  .play .ripple { animation: ripple 1.2s 1.95s ease-out infinite; }\\n  @keyframes ripple {\\n    0%   { width: 8px; height: 8px; opacity: 0.8; border-width: 4px; }\\n    100% { width: 220px; height: 220px; opacity: 0; border-width: 1px; }\\n  }\\n\\n  /* Counter callout */\\n  .callout {\\n    position: absolute; left: 50%; top: 28%;\\n    transform: translate(-50%, 0) scale(0.9);\\n    background: white;\\n    border-radius: 14px;\\n    padding: 10px 14px;\\n    box-shadow: 0 10px 24px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);\\n    text-align: center;\\n    opacity: 0;\\n    z-index: 22;\\n    min-width: 200px;\\n  }\\n  .callout::after {\\n    content: ''; position: absolute; left: 50%; bottom: -6px;\\n    transform: translateX(-50%) rotate(45deg);\\n    width: 12px; height: 12px; background: white;\\n  }\\n  .callout .num {\\n    font: 800 22px var(--font-sans);\\n    background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n    -webkit-background-clip: text; background-clip: text; color: transparent;\\n    letter-spacing: -0.02em;\\n  }\\n  .callout .lbl { font: 500 11px var(--font-sans); color: oklch(45% 0.005 285); }\\n  .play .callout { animation: calloutIn 0.45s 2.1s cubic-bezier(.3, 1.4, .5, 1) forwards; }\\n  @keyframes calloutIn {\\n    to { opacity: 1; transform: translate(-50%, 0) scale(1); }\\n  }\\n\\n  /* Sticky CTA appears */\\n  .cta-strip {\\n    position: absolute; left: 16px; right: 16px; bottom: 16px;\\n    background: white;\\n    border-radius: 16px;\\n    padding: 10px;\\n    box-shadow: 0 8px 24px rgba(0,0,0,.10);\\n    opacity: 0; transform: translateY(20px);\\n    z-index: 24;\\n  }\\n  .cta-strip button {\\n    width: 100%; height: 44px; border-radius: 10px;\\n    background: var(--color-primary); color: white;\\n    font: 600 14px var(--font-sans); display:flex; align-items:center; justify-content:center; gap: 8px;\\n  }\\n  .play .cta-strip { animation: ctaIn 0.4s 2.5s cubic-bezier(.3, 1.2, .5, 1) forwards; }\\n  @keyframes ctaIn { to { opacity: 1; transform: translateY(0); } }\\n\\n  /* Label */\\n  .play-label {\\n    position: absolute; top: 8px; left: 8px; right: 8px;\\n    text-align: center;\\n    font: 500 10px var(--font-sans);\\n    color: oklch(50% 0.005 285); letter-spacing: 0.08em; text-transform: uppercase;\\n    z-index: 35;\\n  }\\n\\n  /* Storyboard panels */\\n  .board { background: white; border-radius: 16px; padding: 20px; }\\n  .frames { display: grid; grid-template-columns: 1fr; gap: 16px; }\\n  .frame {\\n    display: grid; grid-template-columns: 64px 1fr;\\n    gap: 14px; align-items: start;\\n    padding: 12px 0; border-top: 1px solid oklch(94% 0 0);\\n  }\\n  .frame:first-child { border-top: 0; padding-top: 0; }\\n  .frame .t {\\n    font: 600 13px var(--font-sans);\\n    color: var(--color-primary);\\n    background: color-mix(in oklch, var(--color-primary) 10%, white);\\n    border-radius: 8px; padding: 6px 0; text-align: center;\\n    font-variant-numeric: tabular-nums;\\n  }\\n  .frame .d { font: 500 13.5px/1.55 var(--font-sans); color: var(--color-base-content); }\\n  .frame .d small { display: block; color: oklch(45% 0.005 285); font-weight: 400; margin-top: 2px; font-size: 12px; }\\n&lt;\\u002Fstyle&gt;\\n\\n&lt;\\u002Fhead&gt;\\n&lt;body&gt;\\n\\n&lt;div class=\\&quot;stage\\&quot;&gt;\\n  &lt;div class=\\&quot;header-row\\&quot;&gt;\\n    &lt;span class=\\&quot;stamp\\&quot;&gt;Artifact #5 · Wow-moment&lt;\\u002Fspan&gt;\\n    &lt;h2&gt;Splash + pin drop + heatmap reveal&lt;\\u002Fh2&gt;\\n    &lt;p class=\\&quot;lede\\&quot;&gt;CSS-only 2.5-секундная сцена для демо руководителю Аквафор. Запускается на cold-load, переиспользуется как pin-drop animation в production. Touch-friendly: тап для replay.&lt;\\u002Fp&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n  &lt;div class=\\&quot;controls\\&quot;&gt;\\n    &lt;button class=\\&quot;primary\\&quot; onclick=\\&quot;play()\\&quot;&gt;▶ Воспроизвести&lt;\\u002Fbutton&gt;\\n    &lt;button onclick=\\&quot;play()\\&quot;&gt;↻ Replay&lt;\\u002Fbutton&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n  &lt;div class=\\&quot;demo-row\\&quot;&gt;\\n\\n    &lt;!-- LEFT: phone with animation --&gt;\\n    &lt;div&gt;\\n      &lt;div class=\\&quot;phone\\&quot;&gt;&lt;div class=\\&quot;phone-screen\\&quot;&gt;\\n        &lt;div class=\\&quot;phone-notch\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;stage-screen\\&quot; id=\\&quot;screen\\&quot;&gt;\\n          &lt;!-- Curtain with logo --&gt;\\n          &lt;div class=\\&quot;curtain\\&quot;&gt;\\n            &lt;div class=\\&quot;curtain-logo\\&quot;&gt;PROSTOR&lt;\\u002Fdiv&gt;\\n          &lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- Map base (visible after curtain) --&gt;\\n          &lt;div class=\\&quot;map-bg\\&quot; style=\\&quot;opacity: 0.6;\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- Heatmap reveal layer --&gt;\\n          &lt;div class=\\&quot;heat\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- Falling drop --&gt;\\n          &lt;div class=\\&quot;drop\\&quot;&gt;\\n            &lt;svg viewBox=\\&quot;0 0 24 28\\&quot; xmlns=\\&quot;http://www.w3.org/2000/svg\\&quot;&gt;\\n              &lt;path d=\\&quot;M12 1 C 5 12, 4 18, 12 27 C 20 18, 19 12, 12 1 Z\\&quot; fill=\\&quot;var(--color-primary)\\&quot; stroke=\\&quot;oklch(40% 0.20 262)\\&quot; stroke-width=\\&quot;1\\&quot;&gt;&lt;\\u002Fpath&gt;\\n              &lt;ellipse cx=\\&quot;9\\&quot; cy=\\&quot;10\\&quot; rx=\\&quot;2.5\\&quot; ry=\\&quot;4\\&quot; fill=\\&quot;rgba(255,255,255,.4)\\&quot;&gt;&lt;\\u002Fellipse&gt;\\n            &lt;\\u002Fsvg&gt;\\n          &lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- Callout \\&quot;1817 analyses\\&quot; --&gt;\\n          &lt;div class=\\&quot;callout\\&quot;&gt;\\n            &lt;div class=\\&quot;num\\&quot;&gt;1&amp;nbsp;817&lt;\\u002Fdiv&gt;\\n            &lt;div class=\\&quot;lbl\\&quot;&gt;анализов в&amp;nbsp;этой ячейке&lt;\\u002Fdiv&gt;\\n          &lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- Pin --&gt;\\n          &lt;div class=\\&quot;ripple\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;pin-drop\\&quot;&gt;\\n            &lt;svg viewBox=\\&quot;0 0 36 44\\&quot; xmlns=\\&quot;http://www.w3.org/2000/svg\\&quot;&gt;\\n              &lt;path d=\\&quot;M18 2 C 8 2, 2 9, 2 18 C 2 28, 18 42, 18 42 C 18 42, 34 28, 34 18 C 34 9, 28 2, 18 2 Z\\&quot; fill=\\&quot;var(--color-primary)\\&quot; stroke=\\&quot;white\\&quot; stroke-width=\\&quot;2\\&quot;&gt;&lt;\\u002Fpath&gt;\\n              &lt;circle cx=\\&quot;18\\&quot; cy=\\&quot;17\\&quot; r=\\&quot;5\\&quot; fill=\\&quot;white\\&quot;&gt;&lt;\\u002Fcircle&gt;\\n            &lt;\\u002Fsvg&gt;\\n          &lt;\\u002Fdiv&gt;\\n\\n          &lt;!-- Bottom CTA strip --&gt;\\n          &lt;div class=\\&quot;cta-strip\\&quot;&gt;\\n            &lt;button&gt;\\n              &lt;svg width=\\&quot;16\\&quot; height=\\&quot;16\\&quot; viewBox=\\&quot;0 0 24 24\\&quot; fill=\\&quot;currentColor\\&quot;&gt;&lt;path d=\\&quot;M12 2C7 9 4 13 4 17a8 8 0 0 0 16 0c0-4-3-8-8-15Z\\&quot;&gt;&lt;\\u002Fpath&gt;&lt;\\u002Fsvg&gt;\\n              Узнать химию воды по&amp;nbsp;адресу\\n            &lt;\\u002Fbutton&gt;\\n          &lt;\\u002Fdiv&gt;\\n\\n          &lt;span class=\\&quot;play-label\\&quot;&gt;Кашира · Подмосковье&lt;\\u002Fspan&gt;\\n        &lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;&lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n\\n    &lt;!-- RIGHT: storyboard --&gt;\\n    &lt;div class=\\&quot;board\\&quot;&gt;\\n      &lt;div style=\\&quot;font: 600 13px var(--font-sans); color: var(--color-base-content); margin-bottom: 6px;\\&quot;&gt;Раскадровка · 2.5&amp;nbsp;с&lt;\\u002Fdiv&gt;\\n      &lt;div style=\\&quot;font: 400 12px/1.5 var(--font-sans); color: oklch(45% 0.005 285); margin-bottom: 16px;\\&quot;&gt;\\n        Каждая ступень мотивирована: &lt;i&gt;зачем&lt;\\u002Fi&gt; юзер должен почувствовать каплю / занавес / шум.\\n      &lt;\\u002Fdiv&gt;\\n\\n      &lt;div class=\\&quot;frames\\&quot;&gt;\\n        &lt;div class=\\&quot;frame\\&quot;&gt;\\n          &lt;div class=\\&quot;t\\&quot;&gt;0.0—0.6&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;d\\&quot;&gt;Синий «занавес» с PROSTOR на старте\\n            &lt;small&gt;Закрывает первый сетевой запрос карты. Не пустой spinner — это уже бренд-моментик.&lt;\\u002Fsmall&gt;\\n          &lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;frame\\&quot;&gt;\\n          &lt;div class=\\&quot;t\\&quot;&gt;0.6—1.1&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;d\\&quot;&gt;Капля воды падает с верха, занавес «стекает» вниз каплеподобной формой\\n            &lt;small&gt;Метафора «вода открывает информацию». Связь капля → водо-aware приложение.&lt;\\u002Fsmall&gt;\\n          &lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;frame\\&quot;&gt;\\n          &lt;div class=\\&quot;t\\&quot;&gt;1.1—1.4&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;d\\&quot;&gt;Из точки падения хитмап разворачивается радиально\\n            &lt;small&gt;«Облако» данных оживает из одной капли — wow-перетекание масштаба (1&amp;nbsp;капля → 15&amp;nbsp;504 анализа).&lt;\\u002Fsmall&gt;\\n          &lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;frame\\&quot;&gt;\\n          &lt;div class=\\&quot;t\\&quot;&gt;1.7—2.1&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;d\\&quot;&gt;Пин падает на Каширу с bounce + ripple-волна\\n            &lt;small&gt;Этот же sub-animation переиспользуется в production при &lt;code&gt;setPin()&lt;\\u002Fcode&gt; — никакой одноразовой анимации.&lt;\\u002Fsmall&gt;\\n          &lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;frame\\&quot;&gt;\\n          &lt;div class=\\&quot;t\\&quot;&gt;2.1—2.5&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;d\\&quot;&gt;Сверху всплывает callout «1&amp;nbsp;817 анализов» — снизу sticky CTA\\n            &lt;small&gt;Конкретное число даёт «по-настоящему много» вместо абстрактного heatmap.&lt;\\u002Fsmall&gt;\\n          &lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n\\n      &lt;div style=\\&quot;margin-top: 18px; padding: 12px 14px;\\n                  background: color-mix(in oklch, var(--color-primary) 8%, white);\\n                  border-radius: 10px; font: 400 12.5px/1.55 var(--font-sans);\\&quot;&gt;\\n        &lt;b style=\\&quot;color: var(--color-primary)\\&quot;&gt;Использование в production:&lt;\\u002Fb&gt;&lt;br&gt;\\n        Полная 2.5&amp;nbsp;с сцена — только cold-load &amp;amp; demo-route &lt;code&gt;/water?demo=1&lt;\\u002Fcode&gt;.&lt;br&gt;\\n        Шаги «капля&amp;nbsp;→&amp;nbsp;ripple&amp;nbsp;→&amp;nbsp;callout» (с&amp;nbsp;1.7s) — переиспользовать при каждом &lt;code&gt;setPin()&lt;\\u002Fcode&gt;.\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n  &lt;\\u002Fdiv&gt;\\n&lt;\\u002Fdiv&gt;\\n\\n&lt;script&gt;\\n  function play() {\\n    const s = document.getElementById('screen');\\n    s.classList.remove('play');\\n    // Force reflow so animations restart\\n    void s.offsetWidth;\\n    s.classList.add('play');\\n  }\\n  // Auto-play once on load\\n  window.addEventListener('load', () =&gt; setTimeout(play, 300));\\n&lt;\\u002Fscript&gt;\\n\\n\\n&lt;\\u002Fbody&gt;&lt;\\u002Fhtml&gt;&quot;\n  &lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\" class=\"artifact-frame short\" loading=\"lazy\" title=\"Wow splash\"><\u002Fiframe>\n      <div class=\"artifact-link\">\n        <span>2.5s loop · 390 × 844 demo<\u002Fspan>\n        <a href=\"05-wow-splash.html\" target=\"_blank\">Открыть в отдельной вкладке →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ -->\n<!-- ARTIFACT 6                                                    -->\n<!-- ============================================================ -->\n<section id=\"a6\">\n  <div class=\"container\">\n    <div class=\"sub\">Artifact #6<\u002Fdiv>\n    <h2>OKLCH palette + green-conflict fix<\u002Fh2>\n    <p class=\"desc\">\n      Severity (4 уровня) + Aquifer (5 горизонтов) + Availability (3 состояния) + Brand. Найден конфликт: severity-safe-green vs aquifer-Песчаный-green&nbsp;— ΔH&nbsp;5°. Refresh: aquifer-Песчаный → khaki H&nbsp;95°.\n    <\u002Fp>\n    <div class=\"artif
