alette + conflict fix&lt;\\u002Ftitle&gt;\\n&lt;script src=\\&quot;ed566dd7-d8a3-4c79-96f9-0c0aefe03cae\\&quot;&gt;&lt;\\u002Fscript&gt;\\n&lt;style&gt;/* ============================================================\\n   PROSTOR water-map review — shared map placeholder + tokens\\n   ============================================================ */\\n\\n:root {\\n  --color-primary:  oklch(54% 0.245 262.881);\\n  --color-primary-content: #fff;\\n  --color-base-100: #fff;\\n  --color-base-200: oklch(98% 0 0);\\n  --color-base-300: oklch(95% 0 0);\\n  --color-base-content: oklch(21% 0.006 285.885);\\n  --color-success: oklch(76% 0.177 163.223);\\n  --color-warning: oklch(82% 0.189 84.429);\\n  --color-error:   oklch(71% 0.194 13.428);\\n\\n  /* Severity scale */\\n  --sev-safe:        oklch(72% 0.16 150);\\n  --sev-borderline:  oklch(82% 0.16 95);\\n  --sev-concerning:  oklch(72% 0.18 50);\\n  --sev-unsafe:      oklch(62% 0.22 25);\\n\\n  /* Aquifer (refreshed — no severity-green conflict) */\\n  --aq-verkhovodka:  oklch(50% 0.09 55);   /* terracotta */\\n  --aq-pesch:        oklch(68% 0.12 95);   /* khaki / sand */\\n  --aq-pesch-izv:    oklch(70% 0.10 195);  /* teal */\\n  --aq-izv:          oklch(55% 0.18 250);  /* strong blue */\\n  --aq-artezian:     oklch(48% 0.20 305);  /* deep purple */\\n\\n  /* Type */\\n  --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;\\n}\\n\\nhtml, body {\\n  font-family: var(--font-sans);\\n  color: var(--color-base-content);\\n  -webkit-font-smoothing: antialiased;\\n}\\n\\n.gradient-text {\\n  background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n  -webkit-background-clip: text; background-clip: text; color: transparent;\\n}\\n\\n/* ============================================================\\n   Map placeholder — looks like CARTO Voyager + heatmap stack\\n   Drop this on a full-bleed div with class .map-bg\\n   ============================================================ */\\n.map-bg {\\n  position: absolute; inset: 0;\\n  background:\\n    /* heatmap blobs (red / orange / yellow / green) */\\n    radial-gradient(circle at 30% 40%, oklch(62% 0.22 25 / .55), transparent 18%),\\n    radial-gradient(circle at 42% 48%, oklch(62% 0.22 25 / .55), transparent 22%),\\n    radial-gradient(circle at 55% 55%, oklch(72% 0.18 50 / .50), transparent 16%),\\n    radial-gradient(circle at 38% 60%, oklch(62% 0.22 25 / .50), transparent 14%),\\n    radial-gradient(circle at 65% 35%, oklch(82% 0.16 95 / .45), transparent 14%),\\n    radial-gradient(circle at 22% 65%, oklch(72% 0.16 150 / .45), transparent 16%),\\n    radial-gradient(circle at 70% 70%, oklch(72% 0.16 150 / .42), transparent 18%),\\n    radial-gradient(circle at 50% 28%, oklch(72% 0.16 150 / .35), transparent 22%),\\n    /* basemap tone (CARTO Voyager cream) */\\n    linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\n}\\n.map-bg::after {\\n  /* faint road/grid hint */\\n  content: '';\\n  position: absolute; inset: 0;\\n  background-image:\\n    linear-gradient(60deg, rgba(0,0,0,.04) 1px, transparent 1px),\\n    linear-gradient(-60deg, rgba(0,0,0,.04) 1px, transparent 1px);\\n  background-size: 80px 80px, 80px 80px;\\n  pointer-events: none;\\n}\\n.map-bg .dots {\\n  position: absolute; inset: 0;\\n  background-image:\\n    radial-gradient(circle 2px at 18% 22%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 32% 30%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 44% 40%, var(--sev-unsafe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 56% 48%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 30% 62%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 62% 65%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 72% 50%, var(--sev-borderline) 100%, transparent 0),\\n    radial-gradient(circle 2px at 48% 70%, var(--sev-concerning) 100%, transparent 0),\\n    radial-gradient(circle 2px at 78% 30%, var(--sev-safe) 100%, transparent 0),\\n    radial-gradient(circle 2px at 26% 48%, var(--sev-unsafe) 100%, transparent 0);\\n}\\n.map-label {\\n  position: absolute;\\n  font: 500 11px var(--font-sans);\\n  color: rgba(60, 60, 70, 0.55);\\n  letter-spacing: 0.04em;\\n  text-transform: uppercase;\\n  pointer-events: none;\\n}\\n\\n/* Severity dot */\\n.sev-dot {\\n  display: inline-block; width: 8px; height: 8px; border-radius: 999px;\\n  flex-shrink: 0;\\n}\\n.sev-dot.safe       { background: var(--sev-safe); }\\n.sev-dot.borderline { background: var(--sev-borderline); }\\n.sev-dot.concerning { background: var(--sev-concerning); }\\n.sev-dot.unsafe     { background: var(--sev-unsafe); }\\n\\n/* Severity chip */\\n.sev-chip {\\n  display: inline-flex; align-items: center; gap: 6px;\\n  padding: 4px 10px; border-radius: 999px;\\n  font: 500 12px var(--font-sans);\\n}\\n.sev-chip.unsafe     { background: color-mix(in oklch, var(--sev-unsafe) 18%, white); color: oklch(35% 0.15 25); }\\n.sev-chip.concerning { background: color-mix(in oklch, var(--sev-concerning) 22%, white); color: oklch(38% 0.13 50); }\\n.sev-chip.borderline { background: color-mix(in oklch, var(--sev-borderline) 30%, white); color: oklch(40% 0.10 80); }\\n.sev-chip.safe       { background: color-mix(in oklch, var(--sev-safe) 28%, white); color: oklch(38% 0.10 165); }\\n\\n/* Phone frame */\\n.phone {\\n  width: 390px; height: 844px;\\n  border-radius: 44px;\\n  background: #000;\\n  padding: 10px;\\n  box-shadow: 0 30px 60px -20px rgba(20,30,60,.25), 0 0 0 1px rgba(0,0,0,.04);\\n  position: relative;\\n}\\n.phone-screen {\\n  width: 100%; height: 100%;\\n  border-radius: 36px; overflow: hidden;\\n  background: #fff; position: relative;\\n}\\n.phone-notch {\\n  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);\\n  width: 110px; height: 28px; background: #000; border-radius: 999px; z-index: 50;\\n}\\n\\n/* App-chrome (header + dock) */\\n.app-header {\\n  height: 56px; padding: 0 16px;\\n  display: flex; align-items: center; justify-content: space-between;\\n  background: #fff; border-bottom: 1px solid rgba(0,0,0,.06);\\n  position: relative; z-index: 30;\\n}\\n.app-header .logo {\\n  font: 800 17px var(--font-sans); letter-spacing: 0.02em;\\n}\\n.app-dock {\\n  position: absolute; left: 0; right: 0; bottom: 0;\\n  height: 72px; background: #fff;\\n  display: grid; grid-template-columns: 56px 1fr 1fr 1fr;\\n  align-items: center; padding: 0 8px;\\n  box-shadow: 0 -1px 3px 0 rgba(0,0,0,.06);\\n  z-index: 30;\\n}\\n.app-dock .avatar {\\n  width: 36px; height: 36px; border-radius: 999px; background: #1a1a1a; color: #fff;\\n  display: grid; place-items: center; font: 600 13px var(--font-sans);\\n}\\n.dock-tab {\\n  display: flex; flex-direction: column; align-items: center; gap: 2px;\\n  font: 500 11px var(--font-sans); color: oklch(40% 0.005 285);\\n}\\n.dock-tab.active { color: var(--color-primary); }\\n.dock-tab .ico { width: 20px; height: 20px; }\\n.dock-tab.active::after {\\n  content: ''; width: 24px; height: 2px; border-radius: 999px;\\n  background: var(--color-base-content); margin-top: 2px;\\n}\\n&lt;\\u002Fstyle&gt;\\n&lt;style&gt;\\n  body { background: oklch(97% 0.005 250); padding: 32px 16px 80px; }\\n  .stage { max-width: 1100px; margin: 0 auto; }\\n  .stamp { display:inline-block; font: 600 10px var(--font-sans); letter-spacing:0.1em; text-transform:uppercase;\\n           color: var(--color-primary); padding: 3px 8px; border-radius: 999px;\\n           background: color-mix(in oklch, var(--color-primary) 10%, white); margin-bottom: 8px; }\\n  h2 { font: 700 28px var(--font-sans); letter-spacing: -0.01em; margin: 0 0 4px; }\\n  h3 { font: 700 18px var(--font-sans); letter-spacing: -0.01em; margin: 0 0 12px; }\\n  .lede { color: oklch(45% 0.005 285); font-size: 15px; max-width: 720px; margin: 0 auto 36px; text-align: center; }\\n  .header-row { text-align: center; margin-bottom: 28px; }\\n\\n  .card { background: white; border-radius: 16px; padding: 24px; }\\n\\n  .row5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }\\n  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }\\n  .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }\\n\\n  .swatch {\\n    aspect-ratio: 1.4; border-radius: 12px; padding: 10px;\\n    display: flex; flex-direction: column; justify-content: space-between;\\n    color: white;\\n  }\\n  .swatch .label { font: 600 12px var(--font-sans); }\\n  .swatch .meta  { font: 500 9.5px var(--font-mono, ui-monospace); opacity: 0.9; letter-spacing: 0.02em; }\\n  .swatch.dark   { color: oklch(25% 0.01 285); }\\n  .swatch.dark .meta { opacity: 0.65; }\\n\\n  .scale-row {\\n    display: grid; grid-template-columns: 100px 1fr; gap: 12px; align-items: center;\\n    padding: 8px 0; border-top: 1px solid oklch(94% 0 0);\\n  }\\n  .scale-row:first-child { border-top: 0; }\\n  .scale-row .name { font: 500 13px var(--font-sans); }\\n  .scale-row .name small { display: block; font: 400 10.5px var(--font-mono); color: oklch(50% 0 0); margin-top: 2px; }\\n  .scale-bar { height: 22px; border-radius: 4px; }\\n\\n  .conflict {\\n    background: color-mix(in oklch, var(--sev-concerning) 14%, white);\\n    border-left: 3px solid var(--sev-concerning);\\n    padding: 16px 20px; border-radius: 8px; margin-bottom: 24px;\\n  }\\n  .conflict h4 {\\n    font: 700 13px var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase;\\n    color: oklch(38% 0.13 50); margin: 0 0 6px;\\n  }\\n\\n  /* Side-by-side dot comparison */\\n  .dot-compare { display: flex; gap: 8px; align-items: center; font: 500 11px var(--font-sans); }\\n  .dot-compare .d { width: 12px; height: 12px; border-radius: 999px; }\\n\\n  .badge-fix {\\n    display: inline-block;\\n    font: 600 9.5px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase;\\n    padding: 2px 7px; border-radius: 4px; margin-left: 6px;\\n    background: color-mix(in oklch, var(--sev-safe) 28%, white);\\n    color: oklch(34% 0.10 165);\\n  }\\n\\n  code.tok {\\n    font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace;\\n    background: oklch(96% 0.005 250); padding: 1px 6px; border-radius: 4px;\\n  }\\n  table { width: 100%; border-collapse: collapse; }\\n  th, td { text-align: left; padding: 8px 10px; font: 400 12px var(--font-sans); }\\n  th { font-weight: 600; color: oklch(40% 0.005 285); border-bottom: 1px solid oklch(92% 0 0); }\\n  tr:not(:last-child) td { border-bottom: 1px solid oklch(96% 0 0); }\\n&lt;\\u002Fstyle&gt;\\n\\n&lt;\\u002Fhead&gt;\\n&lt;body&gt;\\n\\n&lt;div class=\\&quot;stage\\&quot;&gt;\\n\\n  &lt;div class=\\&quot;header-row\\&quot;&gt;\\n    &lt;span class=\\&quot;stamp\\&quot;&gt;Artifact #6 · OKLCH palette&lt;\\u002Fspan&gt;\\n    &lt;h2&gt;Water-map color system&lt;\\u002Fh2&gt;\\n    &lt;p class=\\&quot;lede\\&quot;&gt;Severity · Aquifer · Availability · Brand. Все цвета — в&amp;nbsp;OKLCH, выровненные по lightness/chroma. Один конфликт зафиксирован и предложен фикс.&lt;\\u002Fp&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n  &lt;!-- ============================== --&gt;\\n  &lt;!-- SECTION 1: SEVERITY            --&gt;\\n  &lt;!-- ============================== --&gt;\\n  &lt;div class=\\&quot;card\\&quot; style=\\&quot;margin-bottom: 24px;\\&quot;&gt;\\n    &lt;h3&gt;1 · Severity — 4 уровня&lt;\\u002Fh3&gt;\\n    &lt;p style=\\&quot;font: 400 13px/1.5 var(--font-sans); color: oklch(45% 0.005 285); margin: -6px 0 18px;\\&quot;&gt;\\n      Семантический смысл фиксирован: red = unsafe, green = safe. Не трогаем — только нормализуем lightness/chroma.\\n    &lt;\\u002Fp&gt;\\n\\n    &lt;div class=\\&quot;row4\\&quot;&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--sev-safe);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;В норме&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L72 · C0.16 · H150&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;safe&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: var(--sev-borderline);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;На границе&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L82 · C0.16 · H95&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;borderline&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--sev-concerning);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Возможно&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L72 · C0.18 · H50&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;concerning&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--sev-unsafe);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Превышение&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L62 · C0.22 · H25&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;unsafe&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n    &lt;div style=\\&quot;margin-top: 18px;\\&quot;&gt;\\n      &lt;div class=\\&quot;scale-row\\&quot;&gt;\\n        &lt;div class=\\&quot;name\\&quot;&gt;Hue ramp&lt;small&gt;safe → unsafe&lt;\\u002Fsmall&gt;&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;scale-bar\\&quot; style=\\&quot;background: linear-gradient(to right, var(--sev-safe), var(--sev-borderline), var(--sev-concerning), var(--sev-unsafe))\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;scale-row\\&quot;&gt;\\n        &lt;div class=\\&quot;name\\&quot;&gt;Chroma&lt;small&gt;0.16 → 0.22&lt;\\u002Fsmall&gt;&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;scale-bar\\&quot; style=\\&quot;background: linear-gradient(to right, oklch(70% 0 285), oklch(70% 0.05 285), oklch(70% 0.10 285), oklch(70% 0.15 285), oklch(70% 0.22 285))\\&quot;&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n    &lt;!-- Contrast vs map basemap --&gt;\\n    &lt;div style=\\&quot;margin-top: 18px; background: oklch(96% 0.005 250); border-radius: 12px; padding: 14px;\\&quot;&gt;\\n      &lt;div style=\\&quot;font: 600 11px var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: oklch(45% 0.005 285); margin-bottom: 10px;\\&quot;&gt;\\n        Видимость на CARTO Voyager (#f8f5ef)\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div style=\\&quot;display: flex; gap: 24px; align-items: center; flex-wrap: wrap;\\&quot;&gt;\\n        &lt;div style=\\&quot;display:flex; align-items:center; gap:6px;\\&quot;&gt;&lt;span class=\\&quot;sev-dot safe\\&quot;&gt;&lt;\\u002Fspan&gt;&lt;span class=\\&quot;text-[12px]\\&quot;&gt;safe — ΔE 38 ✓&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n        &lt;div style=\\&quot;display:flex; align-items:center; gap:6px;\\&quot;&gt;&lt;span class=\\&quot;sev-dot borderline\\&quot;&gt;&lt;\\u002Fspan&gt;&lt;span class=\\&quot;text-[12px]\\&quot;&gt;borderline — ΔE 24 ⚠&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n        &lt;div style=\\&quot;display:flex; align-items:center; gap:6px;\\&quot;&gt;&lt;span class=\\&quot;sev-dot concerning\\&quot;&gt;&lt;\\u002Fspan&gt;&lt;span class=\\&quot;text-[12px]\\&quot;&gt;concerning — ΔE 42 ✓&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n        &lt;div style=\\&quot;display:flex; align-items:center; gap:6px;\\&quot;&gt;&lt;span class=\\&quot;sev-dot unsafe\\&quot;&gt;&lt;\\u002Fspan&gt;&lt;span class=\\&quot;text-[12px]\\&quot;&gt;unsafe — ΔE 58 ✓&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div style=\\&quot;font: 400 11px var(--font-sans); color: oklch(45% 0.005 285); margin-top: 8px;\\&quot;&gt;\\n        ⚠ &lt;b&gt;borderline (L82)&lt;\\u002Fb&gt; теряется на cream-basemap. Рекомендация: или повысить chroma до 0.20, или обвести dots тонким темным кольцом (1.5px &lt;code class=\\&quot;tok\\&quot;&gt;oklch(40% 0.005 285 / .3)&lt;\\u002Fcode&gt;).\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n\\n  &lt;!-- ============================== --&gt;\\n  &lt;!-- SECTION 2: AQUIFER             --&gt;\\n  &lt;!-- ============================== --&gt;\\n  &lt;div class=\\&quot;card\\&quot; style=\\&quot;margin-bottom: 24px;\\&quot;&gt;\\n    &lt;h3&gt;2 · Aquifer — 5 горизонтов &lt;span class=\\&quot;badge-fix\\&quot;&gt;refresh proposed&lt;\\u002Fspan&gt;&lt;\\u002Fh3&gt;\\n\\n    &lt;div class=\\&quot;conflict\\&quot;&gt;\\n      &lt;h4&gt;⚠ Конфликт: severity-green vs aquifer-green&lt;\\u002Fh4&gt;\\n      &lt;div style=\\&quot;font: 400 13px/1.55 var(--font-sans); margin-bottom: 12px;\\&quot;&gt;\\n        На сцене &lt;code&gt;05-desktop-drilling-depth-map.png&lt;\\u002Fcode&gt; + &lt;code&gt;11-desktop-authed&lt;\\u002Fcode&gt; оба слоя могут быть включены вместе. Если 1-й аквифер «Песчаный» — зелёный, а severity «В норме» — тоже зелёный, юзер не отличит их без легенды.\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div style=\\&quot;display: flex; gap: 32px; align-items: flex-start; font: 500 12px var(--font-sans);\\&quot;&gt;\\n        &lt;div&gt;\\n          &lt;div style=\\&quot;color: oklch(40% 0.13 25); margin-bottom: 6px;\\&quot;&gt;Текущая (current):&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;dot-compare\\&quot;&gt;&lt;span class=\\&quot;d\\&quot; style=\\&quot;background: oklch(72% 0.16 150)\\&quot;&gt;&lt;\\u002Fspan&gt; safe (severity)&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;dot-compare\\&quot; style=\\&quot;margin-top: 4px;\\&quot;&gt;&lt;span class=\\&quot;d\\&quot; style=\\&quot;background: oklch(65% 0.14 145)\\&quot;&gt;&lt;\\u002Fspan&gt; Песчаный (aquifer)&lt;\\u002Fdiv&gt;\\n          &lt;div style=\\&quot;margin-top: 4px; color: oklch(40% 0.13 25); font: 500 11px var(--font-sans);\\&quot;&gt;ΔH = 5°, ΔE ≈ 8 — почти неотличимы&lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n        &lt;div&gt;\\n          &lt;div style=\\&quot;color: oklch(35% 0.12 165); margin-bottom: 6px;\\&quot;&gt;Предложение (refresh):&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;dot-compare\\&quot;&gt;&lt;span class=\\&quot;d\\&quot; style=\\&quot;background: oklch(72% 0.16 150)\\&quot;&gt;&lt;\\u002Fspan&gt; safe (как было)&lt;\\u002Fdiv&gt;\\n          &lt;div class=\\&quot;dot-compare\\&quot; style=\\&quot;margin-top: 4px;\\&quot;&gt;&lt;span class=\\&quot;d\\&quot; style=\\&quot;background: oklch(68% 0.12 95)\\&quot;&gt;&lt;\\u002Fspan&gt; Песчаный → khaki&lt;\\u002Fdiv&gt;\\n          &lt;div style=\\&quot;margin-top: 4px; color: oklch(35% 0.12 165); font: 500 11px var(--font-sans);\\&quot;&gt;ΔH = 55°, ΔE ≈ 35 — чётко различимы&lt;\\u002Fdiv&gt;\\n        &lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n    &lt;p style=\\&quot;font: 400 13px/1.5 var(--font-sans); color: oklch(45% 0.005 285); margin: 0 0 18px;\\&quot;&gt;\\n      Палитра идёт по глубине: тёплое (поверхность) → холодное (глубоко). Хроматический «уход в синюю/фиолетовую» = «глубже = чище» (storytelling из &lt;code&gt;06-aquifer-stats-modal&lt;\\u002Fcode&gt;).\\n    &lt;\\u002Fp&gt;\\n\\n    &lt;div class=\\&quot;row5\\&quot;&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--aq-verkhovodka);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Верховодка&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L50 · C0.09 · H55&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;0–15 м&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: var(--aq-pesch);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Песчаный&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L68 · C0.12 · H95&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;15–50 м&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: var(--aq-pesch-izv);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Песч.-извест.&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L70 · C0.10 · H195&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;50–100 м&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--aq-izv);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Известняковый&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L55 · C0.18 · H250&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;100–200 м&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--aq-artezian);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Артезианский&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L48 · C0.20 · H305&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;200 м+&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n    &lt;table style=\\&quot;margin-top: 18px;\\&quot;&gt;\\n      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Горизонт&lt;\\u002Fth&gt;&lt;th&gt;Было (current)&lt;\\u002Fth&gt;&lt;th&gt;Стало (proposed)&lt;\\u002Fth&gt;&lt;th&gt;Причина&lt;\\u002Fth&gt;&lt;\\u002Ftr&gt;&lt;\\u002Fthead&gt;\\n      &lt;tbody&gt;\\n        &lt;tr&gt;&lt;td&gt;Верховодка&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;brown&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;oklch(50% 0.09 55)&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;Глубже terra-tone, без зелёного оттенка&lt;\\u002Ftd&gt;&lt;\\u002Ftr&gt;\\n        &lt;tr&gt;&lt;td&gt;Песчаный&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;green&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;oklch(68% 0.12 95)&lt;\\u002Fcode&gt; khaki&lt;\\u002Ftd&gt;&lt;td&gt;&lt;b&gt;Убрали конфликт с severity-safe&lt;\\u002Fb&gt;&lt;\\u002Ftd&gt;&lt;\\u002Ftr&gt;\\n        &lt;tr&gt;&lt;td&gt;Песч.-извест.&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;cyan&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;oklch(70% 0.10 195)&lt;\\u002Fcode&gt; teal&lt;\\u002Ftd&gt;&lt;td&gt;Сместили в teal, чтобы не путать с brand-blue&lt;\\u002Ftd&gt;&lt;\\u002Ftr&gt;\\n        &lt;tr&gt;&lt;td&gt;Известняковый&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;blue&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;oklch(55% 0.18 250)&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;Контрастнее, остаётся «надёжный» blue&lt;\\u002Ftd&gt;&lt;\\u002Ftr&gt;\\n        &lt;tr&gt;&lt;td&gt;Артезианский&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;purple&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;&lt;code class=\\&quot;tok\\&quot;&gt;oklch(48% 0.20 305)&lt;\\u002Fcode&gt;&lt;\\u002Ftd&gt;&lt;td&gt;Чуть темнее — глубина читается визуально&lt;\\u002Ftd&gt;&lt;\\u002Ftr&gt;\\n      &lt;\\u002Ftbody&gt;\\n    &lt;\\u002Ftable&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n\\n  &lt;!-- ============================== --&gt;\\n  &lt;!-- SECTION 3: AVAILABILITY        --&gt;\\n  &lt;!-- ============================== --&gt;\\n  &lt;div class=\\&quot;card\\&quot; style=\\&quot;margin-bottom: 24px;\\&quot;&gt;\\n    &lt;h3&gt;3 · Store availability — 3 состояния&lt;\\u002Fh3&gt;\\n\\n    &lt;div class=\\&quot;row4\\&quot;&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--color-success);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Полный&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L76 · C0.18 · H163&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: var(--color-warning);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Частичный&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L82 · C0.19 · H84&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--color-error);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Закрыт&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L71 · C0.19 · H13&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: oklch(85% 0 0); color: oklch(40% 0 0);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Нет данных&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L85 · neutral&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n    &lt;div class=\\&quot;conflict\\&quot; style=\\&quot;margin-top: 18px; background: color-mix(in oklch, var(--sev-borderline) 18%, white); border-color: var(--sev-borderline);\\&quot;&gt;\\n      &lt;h4 style=\\&quot;color: oklch(40% 0.10 80)\\&quot;&gt;⚠ Семантический overlap&lt;\\u002Fh4&gt;\\n      &lt;div style=\\&quot;font: 400 13px/1.55 var(--font-sans);\\&quot;&gt;\\n        &lt;b&gt;severity-borderline&lt;\\u002Fb&gt; (H95) и &lt;b&gt;availability-partial&lt;\\u002Fb&gt; (H84) живут на одном hue → юзер с pin'ом видит на карте yellow точку и думает «вода на границе ПДК», а это «магазин с частичным ассортиментом».&lt;br&gt;&lt;br&gt;\\n        &lt;b&gt;Решение:&lt;\\u002Fb&gt; магазины — это иконки &lt;i&gt;в форме&lt;\\u002Fi&gt;, а не dots. На production уже это сделано (white circle + colored ring) — паттерн сохраняем. Никогда не использовать «фоновый круг availability» того же размера, что severity dot.\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n\\n  &lt;!-- ============================== --&gt;\\n  &lt;!-- SECTION 4: BRAND               --&gt;\\n  &lt;!-- ============================== --&gt;\\n  &lt;div class=\\&quot;card\\&quot; style=\\&quot;margin-bottom: 24px;\\&quot;&gt;\\n    &lt;h3&gt;4 · Brand — PROSTOR water&lt;\\u002Fh3&gt;\\n\\n    &lt;div class=\\&quot;row5\\&quot;&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: var(--color-primary);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Primary&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L54 · C0.245 · H263&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;CTA · gradient-start&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: oklch(74% 0.16 232);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Info&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L74 · C0.16 · H232&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;gradient-end · logo&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: oklch(96% 0.02 232);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Primary-tint&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L96 · C0.02 · H232&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;selected real-estate&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch dark\\&quot; style=\\&quot;background: oklch(98% 0 0);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Base-200&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L98 · neutral&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;subtle surface&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n      &lt;div class=\\&quot;swatch\\&quot; style=\\&quot;background: oklch(21% 0.006 286);\\&quot;&gt;\\n        &lt;div class=\\&quot;label\\&quot;&gt;Base-content&lt;\\u002Fdiv&gt;\\n        &lt;div class=\\&quot;meta\\&quot;&gt;L21 · neutral&lt;br&gt;&lt;span style=\\&quot;opacity:.7\\&quot;&gt;primary text&lt;\\u002Fspan&gt;&lt;\\u002Fdiv&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n\\n    &lt;!-- Gradient text demo --&gt;\\n    &lt;div style=\\&quot;margin-top: 18px; padding: 24px; background: white; border: 1px solid oklch(94% 0 0); border-radius: 12px; text-align: center;\\&quot;&gt;\\n      &lt;span style=\\&quot;font: 800 36px var(--font-sans); letter-spacing: 0.02em;\\n                   background: linear-gradient(to right, var(--color-primary), oklch(74% 0.16 232));\\n                   -webkit-background-clip: text; background-clip: text; color: transparent;\\&quot;&gt;PROSTOR&lt;\\u002Fspan&gt;\\n      &lt;div style=\\&quot;font: 500 11px var(--font-sans); color: oklch(45% 0.005 285); margin-top: 6px;\\&quot;&gt;\\n        &lt;code class=\\&quot;tok\\&quot;&gt;gradient-text: primary → info&lt;\\u002Fcode&gt;\\n      &lt;\\u002Fdiv&gt;\\n    &lt;\\u002Fdiv&gt;\\n  &lt;\\u002Fdiv&gt;\\n\\n\\n  &lt;!-- ============================== --&gt;\\n  &lt;!-- SECTION 5: COMPOSITION TEST     --&gt;\\n  &lt;!-- ============================== --&gt;\\n  &lt;div class=\\&quot;card\\&quot;&gt;\\n    &lt;h3&gt;5 · Композиция — все слои вместе&lt;\\u002Fh3&gt;\\n    &lt;p style=\\&quot;font: 400 13px/1.5 var(--font-sans); color: oklch(45% 0.005 285); margin: -6px 0 18px;\\&quot;&gt;\\n      Финальный тест: на одной карте включены severity dots + aquifer dots + store pins. Refresh-палитра aquifer не пересекается с severity ни по hue, ни по lightness.\\n    &lt;\\u002Fp&gt;\\n\\n    &lt;div style=\\&quot;position: relative; height: 280px; border-radius: 12px; overflow: hidden;\\n                background: linear-gradient(180deg, #f8f5ef 0%, #f3efe7 100%);\\&quot;&gt;\\n      &lt;!-- Heatmap blobs --&gt;\\n      &lt;div style=\\&quot;position: absolute; inset: 0;\\n                  background:\\n                    radial-grad Fli>\n          <li>Hint-card занимает 18% screen, dot-pattern за ней нечитаем<\u002Fli>\n        <\u002Ful>\n        <div class=\"ref-art\">→ mockup #1 (3 variants)<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\">\n          <span class=\"num mob\">07<\u002Fspan><span class=\"title\">AquiferStatsModal mobile<\u002Fspan>\n          <span class=\"ref\">full-screen<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"pro\">\n          <li>Сортировка по minDepth — отличный storytelling<\u002Fli>\n          <li>5 layer cards читаются на 390px без horizontal scroll<\u002Fli>\n          <li>Хайлайт «преобладает 50-100m» сверху — key insight viz<\u002Fli>\n        <\u002Ful>\n        <ul class=\"con\">\n          <li>Grid из 3 chemistry-tiles внутри карточки — текст truncated<\u002Fli>\n          <li>Hint «глубже = лучше» отсутствует — основной insight теряется<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\">\n          <span class=\"num mob\">16<\u002Fspan><span class=\"title\">Authed bottom-sheet<\u002Fspan>\n          <span class=\"ref\">real-estate<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"pro\">\n          <li>«Ваши объекты» сверху bottom-sheet — приоритет правильный<\u002Fli>\n          <li>RealEstatePicker — TYPE_ICONS читаются на 390<\u002Fli>\n        <\u002Ful>\n        <ul class=\"con\">\n          <li>Real-estate items занимают 220px — bottom-sheet сразу длинный<\u002Fli>\n          <li>Pin не auto-устанавливается на 1-й объект — лишний тап<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\">\n          <span class=\"num mob\">17<\u002Fspan><span class=\"title\">Pin + stores layer<\u002Fspan>\n          <span class=\"ref\">authed<\u002Fspan>\n        <\u002Fdiv>\n        <ul class=\"pro\">\n          <li>Pin виден над heatmap — z-order правильный<\u002Fli>\n          <li>White circle stores не ><li>Predator-stacked читаем<\u002Fli><li>SeverityLegend в углу не мешает<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>Header full-width — карта подрезана сверху на 64px<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">03<\u002Fspan><span class=\"title\">All problems · sheet open<\u002Fspan><span class=\"ref\">1280<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Sheet sidebar (340px) сохраняет карту видимой<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>«Точки продаж и приёма» труncated в panel — не помещается<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">03b<\u002Fspan><span class=\"title\">All problems clean<\u002Fspan><span class=\"ref\">no overlay<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>SeverityLegend без sidebar — карта 100% видна<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>Hint-card в центре скрывает Москву<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">04<\u002Fspan><span class=\"title\">Coverage only desktop<\u002Fspan><span class=\"ref\">grey<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Grey-scale density читаем<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>Нет coverage-legend (есть только при Качество ON)<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">05<\u002Fspan><span class=\"title\">Drilling depth-map<\u002Fspan><span class=\"ref\">aquifer<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>AquiferLegend ясная<\u002Fli><li>5 цветов visible<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>Зелёный Песчаный = severity-safe; <span style=\"color: var(--color-primary)\">→ mockup #6<\u002Fspan><\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">06<\u002Fspan><span class=\"title\">AquiferStatsModal desktop<\u002Fspan><span class=\"ref\">storytelling<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Chemistry grid читается полностью<\u002Fli><li>5 layer cards отлично<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>Modal без footer-hint «глубже = чище» — потерян ключевой insight<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">08<\u002Fspan><span class=\"title\">PointPopup desktop<\u002Fspan><span class=\"ref\">well_dug 9м<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>4 severity-секции структурированы<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>На desktop popup-в-popup (поверх AquiferStats) — ментальная стек-overload<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">09<\u002Fspan><span class=\"title\">Bottom-sheet desktop<\u002Fspan><span class=\"ref\">sidebar<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Pills + ViewMode + toggles в sidebar — desktop natural<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>«Жёлез…» truncated — pills не помещаются в 6 столбцов<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">10<\u002Fspan><span class=\"title\">All-params modal desktop<\u002Fspan><span class=\"ref\">22 params<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Group ordering читаем<\u002Fli><li>2 highlight-tile сверху<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>«ПДК 6-9» для pH — формат range отличается от других<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">11<\u002Fspan><span class=\"title\">Authed bottom-sheet desk<\u002Fspan><span class=\"ref\">RE picker<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>«Ваши объекты» logically выше «Слои»<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>Auto-select 1-го объекта — пропущенная automation<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">12<\u002Fspan><span class=\"title\">RE selected + stores<\u002Fspan><span class=\"ref\">12 точек<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Stores layer activated visible через badge «12»<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>«12 точек» — но юзер не видит сколько Полный/Частичный<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">13<\u002Fspan><span class=\"title\">Pin + stores + auto-eq<\u002Fspan><span class=\"ref\">Кашира<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Auto-equipment card снизу — отличный moment<\u002Fli><li>Stores + pin different visual weight<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>«8 проблем» в auto-card — но без severity-distribution viz<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"scen\">\n        <div class=\"head\"><span class=\"num\">14·15<\u002Fspan><span class=\"title\">StorePopup + route polyline<\u002Fspan><span class=\"ref\">Люберцы<\u002Fspan><\u002Fdiv>\n        <ul class=\"pro\"><li>Polyline над heatmap но под markers — z-index идеален<\u002Fli><\u002Ful>\n        <ul class=\"con\"><li>«1ч 39 мин» — у дилера нет cart-shortcut <span style=\"color: var(--color-primary)\">→ mockup #4<\u002Fspan><\u002Fli><\u002Ful>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ============================================================ -->\n<!-- IA                                                            -->\n<!-- ============================================================ -->\n<section id=\"ia\">\n  <div class=\"container\">\n    <div class=\"sub\">Information architecture<\u002Fdiv>\n    <h2>Mobile · сколько тапов до главных задач<\u002Fh2>\n    <p class=\"desc\">\n      4 ключевых вопроса для 4 personas. Каждый — сколько тапов от cold-load (нет pin, нет auth). Текущая IA нагружена pull-ups в bottom-sheet'е и FAB'ы; предложение упрощает через progressive disclosure.\n    <\u002Fp>\n\n    <div class=\"ia\">\n      <table>\n        <thead>\n          <tr><th>Задача<\u002Fth><th>Persona<\u002Fth><th style=\"text-align:center\">Сейчас<\u002Fth><th style=\"text-align:center\">Цель<\u002Fth><th>Путь (предложение)<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr>\n            <td class=\"task\">«Что у меня в воде?»<\u002Ftd>\n            <td>B2C новый<\u002Ftd>\n            <td class=\"taps\">5<\u002Ftd><td class=\"taps\" style=\"color: var(--sev-safe)\">2<\u002Ftd>\n            <td class=\"path\">FTUX CTA → геолокация → PredictModal (был: pin → bottom-sheet → param-pill → FAB → modal)<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"task\">«Какой фильтр?»<\u002Ftd>\n            <td>B2C новый<\u002Ftd>\n            <td class=\"taps\">6<\u002Ftd><td class=\"taps\" style=\"color: var(--sev-safe)\">3<\u002Ftd>\n            <td class=\"path\">FTUX → pin → AutoEquipmentCard «5 рекомендаций» → EquipmentModal<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"task\">«Где ближайший магазин?»<\u002Ftd>\n            <td>B2C → дилер<\u002Ftd>\n            <td class=\"taps\">4<\u002Ftd><td class=\"taps\">3<\u002Ftd>\n            <td class=\"path\">FTUX → pin → Stores toggle (sticky pill) → StorePopup<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"task\">«Глубина бурения?»<\u002Ftd>\n            <td>B2B<\u002Ftd>\n            <td class=\"taps\">5<\u002Ftd><td class=\"taps\" style=\"color: var(--sev-safe)\">3<\u002Ftd>\n            <td class=\"path\">FTUX → pin → Pill «Глубина» (вместо toggle) → DepthPredictSection<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"task\">«Какая химия в моём горизонте?»<\u002Ftd>\n            <td>B2B / аналитика<\u002Ftd>\n            <td class=\"taps\">5<\u002Ftd><td class=\"taps\">4<\u002Ftd>\n            <td class=\"path\">FTUX → pin → bottom-sheet → «Тип воды в районе» → AquiferStatsModal<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td class=\"task\">«Покрытие архива в моём районе»<\u002Ftd>\n            <td>Маркетинг<\u002Ftd>\n            <td class=\"taps\">4<\u002Ftd><td class=\"taps\">3<\u002Ftd>\n            <td class=\"path\">bottom-sheet → Coverage toggle (или прямо из pill «Покрытие»)<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 16px; padding: 14px 18px;\n                background: color-mix(in oklch, var(--color-primary) 6%, white);\n                border-left: 3px solid var(--color-primary); border-radius: 8px;\n                font: 500 13px/1.6 var(--font-sans);\">\n      <b>Ключевая мысль:<\u002Fb> FTUX CTA должен быть «узнать химию воды по адресу» (a&nbsp;not «использовать геолокацию»). Это сокращает path на 2-3 тапа для most-common-задачи и не требует backend изменений. См. <a href=\"#a1\" style=\"color: var(--color-primary); font-weight: 600;\">mockup #1, Variant B<\u002Fa>.\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ============================================================ -->\n<!-- A11Y                                                          -->\n<!-- ============================================================ -->\n<section id=\"a11y\">\n  <div class=\"container\">\n    <div class=\"sub\">Accessibility audit<\u002Fdiv>\n    <h2>Touch · contrast · focus · dvh<\u002Fh2>\n    <p class=\"desc\">\n      Быстрый чек по Apple HIG (touch 44×44), WCAG 2.2 AA contrast и iOS Safari quirks. Не претендует на формальный audit — это shortlist что починить до публичной демо.\n    <\u002Fp>\n\n    <div class=\"a11y-grid\">\n\n      <div class=\"a11y\">\n        <span class=\"badge ok\">OK<\u002Fspan>\n        <h4>Touch targets — pills<\u002Fh4>\n        <p>Param-pills высота 32px → <b>при padding 4px tap-area 40px<\u002Fb>. Чуть ниже HIG.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: <code>min-height: 44px<\u002Fcode> + tighter horizontal padding.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge warn\">Warn<\u002Fspan>\n        <h4>Severity dots — borderline yellow<\u002Fh4>\n        <p>oklch(82% 0.16 95) на CARTO Voyager #f8f5ef — ΔE ≈ 24. Низко.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: 1.5px темный stroke на borderline (&amp; concerning) dots. См. <a href=\"#a6\" style=\"color: var(--color-primary)\">mockup #6<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge fail\">Fail<\u002Fspan>\n        <h4>Severity-green vs aquifer-green<\u002Fh4>\n        <p>ΔH 5° — colorblind (deuteranopia) <b>не различит вообще<\u002Fb>.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: aquifer-Песчаный → khaki H 95°. См. <a href=\"#a6\" style=\"color: var(--color-primary)\">mockup #6<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge ok\">OK<\u002Fspan>\n        <h4>Focus management — modals<\u002Fh4>\n        <p>Modal close → focus возвращается на trigger (TanStack Query side-effect). Хорошо.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Check: bottom-sheet pull-down — focus уходит в map. Должен в FAB.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge warn\">Warn<\u002Fspan>\n        <h4>dvh vs vh — iOS Safari<\u002Fh4>\n        <p>Bottom-sheet <code>h-[85vh]<\u002Fcode> ломается при home-bar reveal на Safari 16+.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: <code>h-[85dvh]<\u002Fcode> + fallback <code>h-[85vh]<\u002Fcode>. README уже упоминает dvh.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge fail\">Fail<\u002Fspan>\n        <h4>Map controls aria-labels<\u002Fh4>\n        <p>Zoom in/out кнопки maplibre — без <code>aria-label<\u002Fcode> по умолчанию.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: <code>map.addControl(new NavigationControl({...}))<\u002Fcode> — задать i18n RU.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge warn\">Warn<\u002Fspan>\n        <h4>SeverityLegend «i»-кнопка<\u002Fh4>\n        <p>Свёрнутая legend — кружок 32×32. Tap-area меньше HIG.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: <code>min-width: 44px; min-height: 44px<\u002Fcode>; visual oblong 32px остаётся.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge ok\">OK<\u002Fspan>\n        <h4>RTL — не требуется<\u002Fh4>\n        <p>RU-only. Constraint в плане. Не тратим время.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"a11y\">\n        <span class=\"badge warn\">Warn<\u002Fspan>\n        <h4>Pin animation — reduced-motion<\u002Fh4>\n        <p>Wow-splash + pin-drop. На <code>prefers-reduced-motion<\u002Fcode> — должен fade-in без bounce.<\u002Fp>\n        <p style=\"color: var(--color-primary); font-weight: 500;\">Fix: <code>@media (prefers-reduced-motion: reduce)<\u002Fcode> override в <a href=\"#a5\" style=\"color: var(--color-primary)\">mockup #5<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<footer>\n  <div class=\"container\">\n    <p>\n      6 artifact'ов · 13 вариантов · 24 сцены · OKLCH-палитра · all mobile-first.<br>\n      Drop в <code>prostor-app/src/widgets/water-map/<\u002Fcode> или открой каждый отдельно для скриншотов.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
